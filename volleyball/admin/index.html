<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F3A"><title>Admin · CTD Volleyball Damas 2026</title>
<style>
:root{--navy:#0B1F3A;--blue:#0B5FFF;--green:#18D39E;--red:#FF4D4D;--light:#F4F7FB;--line:#DCE3ED;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--light);color:#172033}
header{background:var(--navy);color:#fff;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#cbd5e1;margin:4px 0 0}.public{color:#fff;text-decoration:none;border:1px solid #ffffff44;padding:8px 11px;border-radius:999px;font-weight:800;font-size:12px}
main{max-width:1100px;margin:auto;padding:20px 12px 48px}.login{max-width:430px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}.login h2{margin-top:0;color:var(--navy)}
input,select,textarea,button{font:inherit}.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0}.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}
.hidden{display:none}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar select{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.metric b{font-size:23px;color:var(--navy)}.metric span{display:block;font-size:11px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0}.meta{display:flex;gap:6px;flex-wrap:wrap}.badge{background:#EEF3FA;color:var(--navy);border-radius:999px;padding:6px 8px;font-size:11px;font-weight:800}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:9px;align-items:center;margin:14px 0}.team{display:flex;align-items:center;gap:8px;font-weight:900}.team.away{justify-content:flex-end;text-align:right}.team img{width:38px;height:38px;object-fit:contain}.score{font-size:22px;font-weight:900;color:var(--navy);text-align:center}
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.set{border:1px solid var(--line);border-radius:14px;padding:10px}.set label{font-size:12px;font-weight:850;display:block;margin-bottom:6px}.setrow{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}.set input{width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center;font-size:18px;font-weight:900}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:11px}.controls label{font-size:12px;font-weight:800}.controls select,.controls textarea{border:1px solid var(--line);border-radius:10px;padding:9px}.field{display:flex;flex-direction:column;gap:4px}.save{margin-left:auto;background:var(--blue);color:#fff}.hint{font-size:12px;color:var(--muted);margin-top:8px}.ok{color:#087B58;font-weight:800}.err{color:#B42318;font-weight:800}.flash{padding:11px 13px;border-radius:12px;margin:10px 0;background:#E9FFF7;color:#087B58;font-weight:800}.flash.err{background:#FFF0F0;color:#B42318}
@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.sets{grid-template-columns:1fr}.team{flex-direction:column;text-align:center}.team.away{flex-direction:column-reverse;text-align:center}.save{width:100%;margin-left:0}}
</style></head>
<body>
<header><div class="brand"><img src="https://qhsvvlcgwdmxxappplzh.supabase.co/storage/v1/object/public/logos/schools/craighouse-school.jpg" alt="Craighouse"><div><h1>CTD Volleyball Damas 2026</h1><p>FieldFlow Admin</p></div></div><a class="public" href="../">Vista pública</a></header>
<main>
<section id="login" class="login"><h2>Acceso administrador</h2><p>Ingresa con tu correo institucional y clave.</p><form id="loginForm"><input id="email" type="email" autocomplete="username" placeholder="Correo" required><input id="pin" type="password" autocomplete="current-password" placeholder="Clave" required><button class="btn primary" type="submit">Ingresar</button></form><div id="loginMsg" class="hint"></div></section>
<section id="panel" class="hidden">
<div class="toolbar"><select id="cat"><option value="ALL">Todas las categorías</option><option>Intermedia</option><option>Senior</option></select><select id="state"><option value="ALL">Todos los estados</option><option value="scheduled">Programados</option><option value="live">En vivo</option><option value="finished">Finalizados</option></select><button id="refresh" class="btn ghost">Actualizar</button><button id="logout" class="btn ghost">Salir</button></div>
<div id="summary" class="summary"></div><div id="flash" class="hidden"></div><div id="list"></div>
</section>
</main>
<script>
const API="https://qhsvvlcgwdmxxappplzh.supabase.co/functions/v1/ctd-volleyball-2026-api";const $=id=>document.getElementById(id);let DATA=null;let AUTH=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const t=x=>String(x||"").slice(0,5);
function flash(msg,bad=false){const e=$("flash");e.textContent=msg;e.className="flash"+(bad?" err":"");setTimeout(()=>e.classList.add("hidden"),2500)}
function score(m){if(m.walkover_home||m.walkover_away)return m.walkover_home?"WO · 0:2":"2:0 · WO";let h=0,a=0;[[m.set1_home,m.set1_away],[m.set2_home,m.set2_away],[m.set3_home,m.set3_away]].forEach(([x,y])=>{if(x==null||y==null)return;if(x>y)h++;else a++});return h+" : "+a}
function teamsMap(){return Object.fromEntries((DATA.teams||[]).map(x=>[x.slug,x]))}
function teamBlock(name,logo,away=false){return '<div class="team '+(away?'away':'')+'">'+(away?'':'<img src="'+esc(logo)+'" alt="">')+'<span>'+esc(name)+'</span>'+(away?'<img src="'+esc(logo)+'" alt="">':'')+'</div>'}
function card(m){const tm=teamsMap();let h,a,hl,al;if(m.stage==="group"){h=tm[m.home_team_slug]?.display_name;a=tm[m.away_team_slug]?.display_name;hl=tm[m.home_team_slug]?.logo_url;al=tm[m.away_team_slug]?.logo_url}else{h=m.computed_home?.team||m.home_source;a=m.computed_away?.team||m.away_source;hl=m.computed_home?.logoUrl||"";al=m.computed_away?.logoUrl||""}
return '<article class="card" data-id="'+m.id+'" data-cat="'+m.category+'" data-state="'+m.status+'"><div class="meta"><span class="badge">'+t(m.start_time)+'</span><span class="badge">Cancha '+m.court+'</span><span class="badge">'+m.category+'</span><span class="badge">'+m.stage.toUpperCase()+'</span><span class="badge">'+m.status.toUpperCase()+'</span></div><div class="teams">'+teamBlock(h,hl)+'<div class="score">'+score(m)+'</div>'+teamBlock(a,al,true)+'</div><div class="sets">'+setBox("Set 1 · a 21","set1",m)+setBox("Set 2 · a 21","set2",m)+setBox("Set 3 · tie-break a 15","set3",m)+'</div><div class="controls"><label><input data-k="walkover_home" type="checkbox" '+(m.walkover_home?'checked':'')+'> Walkover local</label><label><input data-k="walkover_away" type="checkbox" '+(m.walkover_away?'checked':'')+'> Walkover visita</label><div class="field"><label>Estado</label><select data-k="status"><option value="scheduled" '+(m.status==="scheduled"?'selected':'')+'>SCHEDULED</option><option value="live" '+(m.status==="live"?'selected':'')+'>LIVE</option><option value="finished" '+(m.status==="finished"?'selected':'')+'>FINAL</option></select></div><button class="btn save" type="button">Guardar</button></div><div class="hint">Sets 1–2 a 21; tie-break a 15; siempre con 2 puntos de diferencia.</div></article>'}
function setBox(label,key,m){return '<div class="set"><label>'+label+'</label><div class="setrow"><input data-k="'+key+'_home" type="number" min="0" inputmode="numeric" value="'+(m[key+"_home"]??"")+'"><b>–</b><input data-k="'+key+'_away" type="number" min="0" inputmode="numeric" value="'+(m[key+"_away"]??"")+'"></div></div>'}
function renderSummary(){const ms=[...(DATA.matches||[]),...(DATA.finals||[])];$("summary").innerHTML=[["Total",ms.length],["Programados",ms.filter(x=>x.status==="scheduled").length],["En vivo",ms.filter(x=>x.status==="live").length],["Finalizados",ms.filter(x=>x.status==="finished").length]].map(x=>'<div class="metric"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("")}
function render(){if(!DATA)return;renderSummary();let ms=[...(DATA.matches||[]),...(DATA.finals||[])];const c=$("cat").value,s=$("state").value;ms=ms.filter(m=>(c==="ALL"||m.category===c)&&(s==="ALL"||m.status===s));$("list").innerHTML=ms.map(card).join("");document.querySelectorAll(".save").forEach(b=>b.addEventListener("click",()=>save(b.closest(".card"))))}
async function load(){const r=await fetch(API);if(!r.ok)throw new Error("No se pudo cargar el torneo");DATA=await r.json();render()}
async function save(el){if(!AUTH)return;const m=[...(DATA.matches||[]),...(DATA.finals||[])].find(x=>x.id===el.dataset.id);const body={action:"save",email:AUTH.email,pin:AUTH.pin,matchId:m.id};el.querySelectorAll("[data-k]").forEach(i=>{body[i.dataset.k]=i.type==="checkbox"?i.checked:i.value});const btn=el.querySelector(".save");btn.disabled=true;btn.textContent="Guardando…";try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"No se pudo guardar");DATA=j.data;render();flash("Partido guardado ✓")}catch(e){flash(e.message||String(e),true)}finally{btn.disabled=false}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),pin=$("pin").value;const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",email,pin})});const j=await r.json();if(!r.ok||!j.ok){$("loginMsg").className="hint err";$("loginMsg").textContent=j.error||"Acceso denegado";return}AUTH={email,pin};$("login").classList.add("hidden");$("panel").classList.remove("hidden");await load()});
$("refresh").addEventListener("click",()=>load().catch(e=>flash(e.message,true)));$("logout").addEventListener("click",()=>{AUTH=null;DATA=null;$("panel").classList.add("hidden");$("login").classList.remove("hidden");$("pin").value=""});$("cat").addEventListener("change",render);$("state").addEventListener("change",render);
</script></body></html>
