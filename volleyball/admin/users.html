<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F3A"><title>Admin Users · CTD Volleyball 2026</title>
<style>
:root{--navy:#0B1F3A;--blue:#0B5FFF;--green:#18D39E;--red:#FF4D4D;--light:#F4F7FB;--line:#DCE3ED;--muted:#667085}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--light);color:#172033}
header{background:var(--navy);color:#fff;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.brand h1{font-size:18px;margin:0}.brand p{font-size:12px;color:#cbd5e1;margin:4px 0 0}
.toplinks{display:flex;gap:8px;flex-wrap:wrap}.link{color:#fff;text-decoration:none;border:1px solid #ffffff44;padding:8px 11px;border-radius:999px;font-weight:800;font-size:12px}
main{max-width:900px;margin:auto;padding:24px 12px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.card h2{margin:0 0 6px;color:var(--navy)}.muted{color:var(--muted);font-size:13px}
.user{display:grid;grid-template-columns:minmax(180px,1.4fr) 90px 1fr auto;gap:10px;align-items:end;padding:14px 0;border-top:1px solid var(--line)}.user:first-of-type{border-top:0}
.label{font-size:11px;font-weight:800;color:var(--muted);display:block;margin-bottom:5px}.email{font-weight:900;color:var(--navy);overflow-wrap:anywhere}.role{font-size:12px;font-weight:800;background:#EEF3FA;border-radius:999px;padding:6px 8px;display:inline-block}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{margin-top:12px;padding:11px 13px;border-radius:12px;background:#E9FFF7;color:#087B58;font-weight:800}.msg.err{background:#FFF0F0;color:#B42318}.hidden{display:none}
@media(max-width:720px){.user{grid-template-columns:1fr}.btn{width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="../../assets/logo-ch-reducido.webp" alt="Craighouse"><div><h1>Admin Users</h1><p>CTD Volleyball 2026 · FieldFlow</p></div></div>
  <div class="toplinks"><a class="link" href="./">Admin</a><a class="link" href="../">Public</a></div>
</header>
<main>
  <section class="card">
    <h2>Administrator passwords</h2>
    <p class="muted">Only <strong>contacto@fieldflow.cl</strong> can use this page. Passwords are updated directly in Supabase Auth and are never displayed or stored here.</p>
    <div id="list"><div class="muted">Loading users…</div></div>
    <div id="msg" class="hidden"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qhsvvlcgwdmxxappplzh.supabase.co";
const SUPABASE_KEY="sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO";
const API="https://qhsvvlcgwdmxxappplzh.supabase.co/functions/v1/ctd-volleyball-admin-users";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function show(msg,bad=false){const e=$("msg");e.textContent=msg;e.className="msg"+(bad?" err":"");setTimeout(()=>e.classList.add("hidden"),3500)}
async function api(body){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href="./";throw new Error("No active session")}
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok||!j.ok)throw new Error(j.error||"Request failed");
  return j;
}
function row(u){
  return '<div class="user" data-id="'+esc(u.id)+'">'+
    '<div><span class="label">USER</span><div class="email">'+esc(u.email)+'</div></div>'+
    '<div><span class="label">ROLE</span><span class="role">'+esc(u.role)+'</span></div>'+
    '<div><span class="label">NEW PASSWORD</span><input class="pwd" type="password" autocomplete="new-password" placeholder="Minimum 10 characters"></div>'+
    '<button class="btn primary set" type="button">Set password</button>'+
  '</div>';
}
async function load(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){location.href="./";return}
    if(String(session.user.email||"").toLowerCase()!=="contacto@fieldflow.cl"){document.body.innerHTML='<main><section class="card"><h2>Access denied</h2><p>Only contacto@fieldflow.cl can manage administrator passwords.</p></section></main>';return}
    const j=await api({action:"list"});
    $("list").innerHTML=j.users.length?j.users.map(row).join(""):'<div class="muted">No administrators found.</div>';
    document.querySelectorAll(".set").forEach(btn=>btn.addEventListener("click",()=>setPassword(btn.closest(".user"))));
  }catch(e){$("list").innerHTML='<div class="msg err">'+esc(e.message||String(e))+'</div>'}
}
async function setPassword(el){
  const pwd=el.querySelector(".pwd").value;
  const btn=el.querySelector(".set");
  if(pwd.length<10){show("La clave debe tener al menos 10 caracteres.",true);return}
  if(!/[A-Z]/.test(pwd)||!/[a-z]/.test(pwd)||!/[0-9]/.test(pwd)||!/[^\w]/.test(pwd)){show("Usa mayúscula, minúscula, número y símbolo.",true);return}
  btn.disabled=true;btn.textContent="Saving…";
  try{
    const j=await api({action:"set_password",user_id:el.dataset.id,password:pwd});
    el.querySelector(".pwd").value="";
    show("Password updated for "+j.email+" ✓");
  }catch(e){show(e.message||String(e),true)}
  finally{btn.disabled=false;btn.textContent="Set password"}
}
load();
</script>
</body></html>
