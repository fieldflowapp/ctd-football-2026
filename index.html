<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1F3A">
  <title>Charles T. Darling Football Tournament 2026</title>
  <link rel="stylesheet" href="css/styles.css?v=20260925-introvideo1">
</head>
<body>
<div id="ffIntroOverlay" class="ff-intro-overlay" aria-label="FieldFlow intro">
  <video id="ffIntroVideo" autoplay muted playsinline preload="auto">
    <source src="/ctd-football-2026/absch-football-2026/assets/fieldflow-intro.mp4" type="video/mp4">
  </video>
</div>
<script>
(function(){
  const overlay=document.getElementById('ffIntroOverlay');
  const video=document.getElementById('ffIntroVideo');
  video.playbackRate=1.5;
  video.defaultPlaybackRate=1.5;

  let closed=false;

  function closeIntro(){
    if(closed)return;
    closed=true;
    overlay.classList.add('hide');
    setTimeout(()=>overlay.remove(),700);
  }

  video.addEventListener('ended',closeIntro,{once:true});
  video.addEventListener('error',closeIntro,{once:true});
  setTimeout(closeIntro,10000);

  const p=video.play();
  if(p&&typeof p.catch==='function')p.catch(closeIntro);
})();
</script>
<header class="topbar">
  <div class="brand">
    <img id="schoolLogo" alt="Craighouse">
    <div><h1>Charles T. Darling Football Tournament 2026</h1><p>Official Tournament Center</p></div>
  </div>
  <img id="ffLogo" class="ff-logo" alt="FieldFlow">
</header>

<main class="container">
  <section class="hero">
    <h2>Football Tournament 2026</h2>
    <p>Craighouse · Dunalastair VN · The Grange · Santiago College</p>
  </section>

  <div class="status-line">
    <span class="live-dot"></span>
    <span>Live data</span>
    <span>·</span>
    <span>Updated <strong id="lastUpdated">--:--:--</strong></span>
    <span>·</span>
    <span>Supabase Realtime</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showView('fixture',this)">Fixture</button>
    <button class="tab" onclick="showView('tables',this)">Standings</button>
    <button class="tab" onclick="showView('finals',this)">Finals</button>
    <button class="tab" onclick="showView('referees',this)">Referees</button>
    <button class="tab" onclick="window.open('bases.html','_blank','noopener')">Rules</button>
  </div>

  <section id="filterPanel" class="filters">
    <div class="filters-grid">
      <div class="filter-group"><label>Category</label><select id="filterCategory" class="filter" onchange="applyFilters()"><option value="ALL">All categories</option></select></div>
      <div class="filter-group"><label>School</label><select id="filterSchool" class="filter" onchange="applyFilters()"><option value="ALL">All schools</option></select></div>
      <div class="filter-group"><label>Field</label><select id="filterField" class="filter" onchange="applyFilters()"><option value="ALL">All fields</option></select></div>
      <div class="filter-group"><label>Referee</label><select id="filterReferee" class="filter" onchange="applyFilters()"><option value="ALL">All referees</option></select></div>
      <div class="filter-group"><label>Status</label><select id="filterStatus" class="filter" onchange="applyFilters()"><option value="ALL">All statuses</option><option value="SCHEDULED">Scheduled</option><option value="LIVE">Live</option><option value="FINAL">Final</option></select></div>
      <button class="btn btn-light" onclick="clearFilters()">Clear</button>
    </div>
    <div id="resultCount" style="margin-top:10px;color:#667085;font-size:12px"></div>
  </section>

  <div id="content"><div class="empty">Loading tournament...</div></div>
</main>

<footer class="footer">© 2026 Craighouse School · Powered by FieldFlow</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260922-supabase"></script>
<script src="js/api.js?v=20260922-logos3"></script>
<script src="js/app.js?v=20260923-english1"></script>
</body>
</html>
