<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d2d"><title>FieldFlow Athletics · Entries</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071d2d;--cyan:#12c8ff;--blue:#0b5fff;--green:#18d39e;--red:#ff4d4d;--ink:#eaf3f8;--muted:#91a7b4;--line:#17384b;--card:#0b2638}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#04121b;color:var(--ink);min-height:100vh}.shell{max-width:1600px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:44px;height:44px;border-radius:12px}.brand h1{font-size:20px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.nav a{color:#d7e8f0;text-decoration:none;border:1px solid #285067;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.nav a.active{background:var(--blue);color:#fff}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.filters{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:12px}label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}select{width:100%;background:#061c2a;border:1px solid #21465a;color:#fff;border-radius:10px;padding:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#17384b;color:#fff}.btn.primary{background:var(--blue)}.btn.good{background:var(--green);color:#04251c}.btn:disabled{opacity:.5}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:72vh}table{border-collapse:collapse;min-width:900px;width:100%}th,td{border-bottom:1px solid #163548;border-right:1px solid #163548;padding:7px;font-size:11px;text-align:center}th{position:sticky;top:0;background:#0a2a3d;z-index:3}.student{position:sticky;left:0;background:#082434;text-align:left;min-width:190px;z-index:2}.student b{display:block}.event{min-width:92px}.entrybox{width:22px;height:22px;accent-color:var(--green)}.status{font-size:12px;font-weight:800}.ok{color:#78efbf}.bad{color:#ff8b8b}@media(max-width:720px){.filters{grid-template-columns:1fr 1fr}.shell{padding:10px}.top{display:block}.tablewrap{max-height:68vh}}
</style>
<link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body><div class="shell">
<div class="top"><div><div class="brand"><img src="../icons/icon-192.png"><div><h1>FieldFlow Athletics</h1><div class="sub">Entries · existing registrations</div></div></div>
<div class="nav"><a href="../">Track</a><a href="../field/">Field</a><a class="active" href="./">Entries</a><a href="../students/">Students</a><a href="../print/">Print</a><a href="../cross-country/">Cross Country</a></div></div>
<div id="user" class="muted"></div></div>
<div class="panel">
<div class="filters"><div><label>Category</label><select id="category"></select></div><div><label>Gender</label><select id="gender"><option value="F">Girls</option><option value="M">Boys</option></select></div><div><label>Colour</label><select id="colour"><option>All</option><option>Blue</option><option>Red</option><option>White</option><option>Green</option></select></div><div><label>Discipline</label><select id="discipline"><option value="all">Track + Field</option><option value="track">Track</option><option value="field">Field</option></select></div></div>
<div class="toolbar"><button class="btn good" id="saveBtn">SAVE ENTRIES</button><span id="summary" class="muted"></span><span id="msg" class="status"></span></div>
<div class="tablewrap"><table id="matrix"></table></div>
</div></div>
<script>
const URL='https://qhsvvlcgwdmxxappplzh.supabase.co',KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO',TID='204a8f52-5525-4077-85e4-1d3811d68323';
const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let athletes=[],events=[],regs=[],dirty=new Map();
function categories(){return ['Y5','Y6','Y7','Y8','Intermediate','Senior']}
async function boot(){
 const {data:{session}}=await sb.auth.getSession(); if(!session){location.replace('../');return}
 $('user').textContent=session.user.email||'';
 const [a,e,r]=await Promise.all([
  sb.from('athletics_athletes').select('*').eq('tournament_id',TID).eq('active',true).order('last_name'),
  sb.from('athletics_events').select('*').eq('tournament_id',TID).in('discipline',['track','field']).order('sort_order'),
  sb.from('athletics_registrations').select('*').eq('tournament_id',TID)
 ]);
 const err=a.error||e.error||r.error;if(err){$('msg').textContent=err.message;$('msg').className='status bad';return}
 athletes=a.data||[];events=e.data||[];regs=r.data||[];
 $('category').innerHTML=categories().map(x=>'<option>'+x+'</option>').join('');
 ['category','gender','colour','discipline'].forEach(id=>$(id).onchange=render);
 $('saveBtn').onclick=save; render();
}
function existing(regKey){const [athleteId,eventId]=regKey.split('|');return regs.find(r=>r.athlete_id===athleteId&&r.event_id===eventId)}
function render(){
 dirty.clear();$('msg').textContent='';
 const cat=$('category').value,g=$('gender').value,col=$('colour').value,disc=$('discipline').value;
 const aa=athletes.filter(a=>a.level===cat&&a.gender===g&&(col==='All'||a.color===col));
 const ee=events.filter(e=>e.category===cat&&e.gender===g&&(disc==='all'||e.discipline===disc));
 let html='<thead><tr><th class="student">Student</th>'+ee.map(e=>'<th class="event">'+esc(e.name)+'<div class="muted">'+esc(e.discipline)+'</div></th>').join('')+'</tr></thead><tbody>';
 html+=aa.map(a=>'<tr><td class="student"><b>'+esc(a.last_name)+', '+esc(a.first_name)+'</b><span class="muted">'+esc(a.color)+' · '+esc(a.external_code)+'</span></td>'+ee.map(e=>{
   const r=regs.find(x=>x.athlete_id===a.id&&x.event_id===e.id),checked=r&&r.status==='registered';
   return '<td><input class="entrybox" type="checkbox" data-a="'+a.id+'" data-e="'+e.id+'" '+(checked?'checked':'')+'></td>'
 }).join('')+'</tr>').join('');
 html+='</tbody>';$('matrix').innerHTML=html;
 $('matrix').querySelectorAll('.entrybox').forEach(cb=>cb.onchange=()=>{dirty.set(cb.dataset.a+'|'+cb.dataset.e,cb.checked);$('msg').textContent=dirty.size+' pending change'+(dirty.size===1?'':'s');$('msg').className='status'});
 const active=regs.filter(r=>r.status==='registered'&&ee.some(e=>e.id===r.event_id)&&aa.some(a=>a.id===r.athlete_id)).length;
 $('summary').textContent=aa.length+' students · '+ee.length+' events · '+active+' active entries';
}
async function save(){
 if(!dirty.size)return;
 $('saveBtn').disabled=true;$('msg').textContent='Saving…';
 try{
  for(const [key,checked] of dirty){
   const [athlete_id,event_id]=key.split('|'),r=existing(key);
   if(checked){
    if(r){const q=await sb.from('athletics_registrations').update({status:'registered',updated_at:new Date().toISOString()}).eq('id',r.id);if(q.error)throw q.error}
    else{const q=await sb.from('athletics_registrations').insert({tournament_id:TID,event_id,athlete_id,status:'registered'}).select().single();if(q.error)throw q.error;regs.push(q.data)}
   }else if(r){
    const q=await sb.from('athletics_registrations').delete().eq('id',r.id);if(q.error)throw q.error;regs=regs.filter(x=>x.id!==r.id)
   }
  }
  dirty.clear();$('msg').textContent='Entries saved.';$('msg').className='status ok';render();
 }catch(err){$('msg').textContent=err.message||err;$('msg').className='status bad'}
 finally{$('saveBtn').disabled=false}
}
boot();
</script></body></html>
