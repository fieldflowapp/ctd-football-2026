<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d2d"><title>FieldFlow Athletics · Students</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0b5fff;--green:#18d39e;--red:#ff4d4d;--ink:#eaf3f8;--muted:#91a7b4;--line:#17384b;--card:#0b2638}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#04121b;color:var(--ink);min-height:100vh}.shell{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:44px;height:44px;border-radius:12px}.brand h1{font-size:20px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.nav a{color:#d7e8f0;text-decoration:none;border:1px solid #285067;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.nav a.active{background:var(--blue);color:#fff}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.filters{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:10px;margin-bottom:12px}label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}select,input{width:100%;background:#061c2a;border:1px solid #21465a;color:#fff;border-radius:10px;padding:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#17384b;color:#fff}.btn.good{background:var(--green);color:#04251c}.btn.primary{background:var(--blue)}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:65vh}table{border-collapse:collapse;width:100%;min-width:760px}th,td{border-bottom:1px solid #163548;padding:9px;font-size:12px;text-align:left}th{position:sticky;top:0;background:#0a2a3d}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:15px}.modal.show{display:grid}.card{width:min(520px,100%);background:#0b2638;border:1px solid #285067;border-radius:16px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:12px;font-weight:800}.ok{color:#78efbf}.bad{color:#ff8b8b}@media(max-width:700px){.filters,.grid{grid-template-columns:1fr 1fr}.top{display:block}}
</style><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png"></head>
<body><div class="shell"><div class="top"><div><div class="brand"><img src="../icons/icon-192.png"><div><h1>FieldFlow Athletics</h1><div class="sub">Students</div></div></div><div class="nav"><a href="../">Track</a><a href="../field/">Field</a><a href="../entries/">Entries</a><a class="active" href="./">Students</a><a href="../print/">Print</a><a href="../cross-country/">Cross Country</a></div></div><div id="user" class="muted"></div></div>
<div class="panel"><div class="filters"><div><label>Category</label><select id="category"><option>All</option><option>Y5</option><option>Y6</option><option>Y7</option><option>Y8</option><option>Intermediate</option><option>Senior</option></select></div><div><label>Gender</label><select id="gender"><option>All</option><option value="F">Girls</option><option value="M">Boys</option></select></div><div><label>Colour</label><select id="colour"><option>All</option><option>Blue</option><option>Red</option><option>White</option><option>Green</option></select></div></div>
<div class="toolbar"><button class="btn good" id="addBtn">+ ADD STUDENT</button><span id="summary" class="muted"></span><span id="msg" class="status"></span></div><div class="tablewrap"><table><thead><tr><th>Last name</th><th>First name</th><th>Year</th><th>Gender</th><th>Colour</th><th>ID</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<div class="modal" id="modal"><div class="card"><h2 style="margin-top:0">Add student</h2><div class="grid"><div><label>First name</label><input id="first"></div><div><label>Last name</label><input id="last"></div><div><label>Year</label><select id="level"><option>Y5</option><option>Y6</option><option>Y7</option><option>Y8</option><option>Intermediate</option><option>Senior</option></select></div><div><label>Gender</label><select id="newGender"><option value="F">Girls</option><option value="M">Boys</option></select></div><div><label>Colour</label><select id="newColour"><option>Blue</option><option>Red</option><option>White</option><option>Green</option></select></div><div><label>Student ID</label><input id="code" placeholder="Auto if blank"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" id="save">SAVE</button><button class="btn" id="cancel">CANCEL</button></div><div id="modalMsg" class="status"></div></div></div>
<script>
const URL='https://qhsvvlcgwdmxxappplzh.supabase.co',KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO',TID='204a8f52-5525-4077-85e4-1d3811d68323';
const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let students=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../');return}$('user').textContent=session.user.email||'';const q=await sb.from('athletics_athletes').select('*').eq('tournament_id',TID).eq('active',true).order('last_name').order('first_name');if(q.error){$('msg').textContent=q.error.message;return}students=q.data||[];['category','gender','colour'].forEach(id=>$(id).onchange=render);$('addBtn').onclick=()=>{$('modal').classList.add('show');$('modalMsg').textContent=''};$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=save;render()}
function render(){const c=$('category').value,g=$('gender').value,col=$('colour').value;const list=students.filter(s=>(c==='All'||s.level===c)&&(g==='All'||s.gender===g)&&(col==='All'||s.color===col));$('rows').innerHTML=list.map(s=>'<tr><td><b>'+esc(s.last_name)+'</b></td><td>'+esc(s.first_name)+'</td><td>'+esc(s.level)+'</td><td>'+(s.gender==='F'?'Girls':'Boys')+'</td><td>'+esc(s.color)+'</td><td>'+esc(s.external_code)+'</td></tr>').join('');$('summary').textContent=list.length+' students'}
async function save(){const first=$('first').value.trim(),last=$('last').value.trim();if(!first||!last){$('modalMsg').textContent='First and last name are required.';return}const code=$('code').value.trim()||('FF-'+Date.now().toString(36).toUpperCase());const payload={tournament_id:TID,first_name:first,last_name:last,level:$('level').value,gender:$('newGender').value,color:$('newColour').value,external_code:code,active:true};const q=await sb.from('athletics_athletes').insert(payload).select().single();if(q.error){$('modalMsg').textContent=q.error.message;$('modalMsg').className='status bad';return}students.push(q.data);$('modal').classList.remove('show');['first','last','code'].forEach(id=>$(id).value='');$('msg').textContent='Student added.';$('msg').className='status ok';render()}
boot();
</script></body></html>
