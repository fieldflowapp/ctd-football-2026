<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071d2d"><title>FieldFlow Athletics · Cross Country</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#0b5fff;--green:#18d39e;--orange:#ff9f1c;--ink:#eaf3f8;--muted:#91a7b4;--line:#17384b;--card:#0b2638}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#04121b;color:var(--ink);min-height:100vh}.shell{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand{display:flex;gap:10px;align-items:center}.brand img{width:44px;height:44px;border-radius:12px}.brand h1{font-size:20px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.nav a{color:#d7e8f0;text-decoration:none;border:1px solid #285067;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.nav a.active{background:var(--blue);color:#fff}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}select{width:100%;background:#061c2a;border:1px solid #21465a;color:#fff;border-radius:10px;padding:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(280px,1fr));gap:12px}.race{border:1px solid var(--line);border-radius:14px;background:#082434;padding:12px}.racehead{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{border:1px solid #285067;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stat{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.colours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.colour{border:1px solid var(--line);border-radius:9px;padding:7px;text-align:center;font-size:10px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;background:#17384b;color:#fff}.btn.primary{background:var(--blue)}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{display:block}}
</style><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-192.png"></head>
<body><div class="shell"><div class="top"><div><div class="brand"><img src="../icons/icon-192.png"><div><h1>FieldFlow Athletics</h1><div class="sub">Cross Country</div></div></div><div class="nav"><a href="../">Track</a><a href="../field/">Field</a><a href="../entries/">Entries</a><a href="../students/">Students</a><a href="../print/">Print</a><a class="active" href="./">Cross Country</a></div></div><div id="user" class="muted"></div></div>
<div class="panel"><div class="filters"><div><label>Level</label><select id="level"><option>All</option><option>Y1</option><option>Y2</option><option>Y3</option><option>Y4</option><option>Y5</option><option>Y6</option><option>Y7</option><option>Y8</option><option>Intermediate</option><option>Senior</option></select></div><div><label>Gender</label><select id="gender"><option>All</option><option value="F">Girls</option><option value="M">Boys</option></select></div></div><div class="toolbar"><span id="summary" class="muted"></span></div><div id="races" class="grid"></div></div></div>
<script>
const URL='https://qhsvvlcgwdmxxappplzh.supabase.co',KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO',TID='204a8f52-5525-4077-85e4-1d3811d68323';
const sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
let races=[],groups=[],attendance=[],results=[];
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session){location.replace('../');return}$('user').textContent=session.user.email||'';
 const [r,g,a,x]=await Promise.all([
  sb.from('athletics_cross_country_races').select('*').eq('tournament_id',TID).order('level').order('gender'),
  sb.from('athletics_cross_country_attendance_groups').select('*').eq('tournament_id',TID),
  sb.from('athletics_cross_country_attendance').select('*').eq('tournament_id',TID),
  sb.from('athletics_cross_country_results').select('*').eq('tournament_id',TID)
 ]);const err=r.error||g.error||a.error||x.error;if(err){$('races').innerHTML='<div class="empty">'+esc(err.message)+'</div>';return}
 races=r.data||[];groups=g.data||[];attendance=a.data||[];results=x.data||[];['level','gender'].forEach(id=>$(id).onchange=render);render()}
function render(){const l=$('level').value,g=$('gender').value,list=races.filter(r=>(l==='All'||r.level===l)&&(g==='All'||r.gender===g));$('summary').textContent=list.length+' races';
 $('races').innerHTML=list.length?list.map(r=>{const rg=groups.filter(x=>x.race_id===r.id),att=attendance.filter(x=>x.race_id===r.id),res=results.filter(x=>x.race_id===r.id),recorded=rg.filter(x=>x.recorded).length,present=att.filter(x=>x.present||x.status==='present').length,finished=res.filter(x=>x.result_status==='finished'||x.finish_position!=null).length;
 const colors=['Blue','Red','White','Green'];return '<div class="race"><div class="racehead"><div><b>'+esc(r.level)+' · '+(r.gender==='F'?'Girls':'Boys')+'</b><div class="muted">Race '+esc(r.id.slice(0,8))+'</div></div><span class="badge">'+esc(r.status)+'</span></div><div class="stats"><div class="stat"><b>'+recorded+'/4</b><span>attendance groups</span></div><div class="stat"><b>'+present+'</b><span>present</span></div><div class="stat"><b>'+finished+'</b><span>results</span></div></div><div class="colours">'+colors.map(c=>{const x=rg.find(z=>z.color===c);return '<div class="colour"><b>'+c+'</b><br>'+(x&&x.recorded?'Recorded':'Pending')+'</div>'}).join('')+'</div></div>'}).join(''):'<div class="empty">No Cross Country races for this filter.</div>'}
boot();
</script></body></html>
