name: Build reduced Craighouse logo

on:
  push:
    paths:
      - 'assets/logo-ch-reducido-parts/**'

permissions:
  contents: write

jobs:
  build-logo:
    if: ${{ !contains(github.event.head_commit.message, '[skip logo-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate parts
        id: parts
        shell: bash
        run: |
          count=$(find assets/logo-ch-reducido-parts -type f -name 'part-*' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -ne 7 ]; then
            echo "Expected 7 parts, found $count. Nothing to build yet."
            exit 0
          fi
      - name: Decode exact logo
        if: steps.parts.outputs.count == '7'
        shell: bash
        run: |
          cat assets/logo-ch-reducido-parts/part-* > /tmp/logo.b64
          base64 -d /tmp/logo.b64 > assets/logo-ch-reducido.webp
          test "$(stat -c%s assets/logo-ch-reducido.webp)" = "38018"
          sha256sum assets/logo-ch-reducido.webp | grep -q '^6c65c9174f4e9ccfd2266651c468d63c49ad395cca4ed4307726ada443b2715a'
          file assets/logo-ch-reducido.webp
      - name: Commit verified logo
        if: steps.parts.outputs.count == '7'
        shell: bash
        run: |
          git config user.name "fieldflowapp"
          git config user.email "contacto@fieldflow.cl"
          git add assets/logo-ch-reducido.webp
          git diff --cached --quiet && exit 0
          git commit -m "Build verified Logo CH Reducido [skip logo-build]"
          git push
