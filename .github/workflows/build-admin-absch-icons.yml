name: Build FieldFlow admin PWA icons v2

on:
  push:
    paths:
      - 'absch-football-2026/fieldflow-app-icon.svg'
      - '.github/workflows/build-admin-absch-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Prepare official admin artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('absch-football-2026/fieldflow-app-icon.svg').read_text()
          s=s.replace('<rect width="512" height="512" fill="#FFFFFF"/>','<rect width="512" height="512" fill="#034887"/>',1)
          s=s.replace('fill="url(#blue)"','fill="#FFFFFF"',1)
          Path('/tmp/fieldflow-admin-v2.svg').write_text(s)
          PY
      - name: Render PNG icons
        run: |
          rsvg-convert -w 512 -h 512 /tmp/fieldflow-admin-v2.svg -o absch-football-2026/admin/fieldflow-admin-v2-512.png
          rsvg-convert -w 192 -h 192 /tmp/fieldflow-admin-v2.svg -o absch-football-2026/admin/fieldflow-admin-v2-192.png
      - name: Commit icons
        run: |
          git config user.name fieldflowapp
          git config user.email contacto@fieldflow.cl
          git add absch-football-2026/admin/fieldflow-admin-v2-*.png
          git diff --cached --quiet || git commit -m "Build admin PWA icons v2"
          git pull --rebase origin main
          git push
