name: Build FieldFlow PWA icons

on:
  push:
    paths:
      - 'assets/fieldflow-logo.png'
      - '.github/workflows/build-fieldflow-app-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip pwa-icon-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build square PNG app icons from FieldFlow logo
        shell: bash
        run: |
          convert assets/fieldflow-logo.png -trim +repage -resize 420x420 -gravity center -background white -extent 512x512 absch-football-2026/fieldflow-app-icon-512.png
          convert absch-football-2026/fieldflow-app-icon-512.png -resize 192x192 absch-football-2026/fieldflow-app-icon-192.png
          file absch-football-2026/fieldflow-app-icon-512.png
          file absch-football-2026/fieldflow-app-icon-192.png
      - name: Commit generated icons
        run: |
          git config user.name "fieldflowapp"
          git config user.email "contacto@fieldflow.cl"
          git add absch-football-2026/fieldflow-app-icon-512.png absch-football-2026/fieldflow-app-icon-192.png
          git diff --cached --quiet && exit 0
          git commit -m "Build FieldFlow PWA icons [skip pwa-icon-build]"
          git push
