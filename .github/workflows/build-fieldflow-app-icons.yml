name: Verify official FieldFlow public PWA icons

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify official PNG assets
        run: |
          test -f absch-football-2026/fieldflow-public-v2-192.png
          test -f absch-football-2026/fieldflow-public-v2-512.png
          echo "Official public PWA icons are PNG source-of-truth assets. Do not regenerate them from SVG."
