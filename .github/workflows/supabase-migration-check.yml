name: Supabase migration checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/api.js
          node --check js/app.js
          node --check admin/admin-api.js
          node --check admin/admin.js

      - name: Ensure Apps Script backend is removed from migrated frontend
        run: |
          ! grep -R "script.google.com\|google.script.run\|api=public\|JSONP"             index.html js admin print referees

      - name: Verify required migration files
        run: |
          test -f index.html
          test -f admin/index.html
          test -f print/index.html
          test -f referees/index.html

      - name: Supabase public smoke test
        run: node tests/supabase-smoke.mjs

      - name: Import ABSCH logos into Supabase Storage
        run: |
          set -e
          RESPONSE=$(curl --silent --show-error -w '\nHTTP_STATUS:%{http_code}' "https://qhsvvlcgwdmxxappplzh.supabase.co/functions/v1/import-absch-logos")
          echo "$RESPONSE"
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          STATUS=$(echo "$RESPONSE" | sed -n 's/HTTP_STATUS://p')
          test "$STATUS" = "200"
          echo "$BODY" | grep '"ok":true'
          if echo "$BODY" | grep -q '"ok":false'; then
            echo "One or more logo imports failed"
            exit 1
          fi
