name: Import ABSCH logos once

on:
  push:
    branches: [ supabase-migration ]
    paths:
      - '.github/workflows/import-absch-logos-once.yml'

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import ABSCH logos into Supabase Storage
        run: |
          set -e
          RESPONSE=$(curl --fail --silent --show-error "https://qhsvvlcgwdmxxappplzh.supabase.co/functions/v1/import-absch-logos")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep '"ok":true'
          if echo "$RESPONSE" | grep -q '"ok":false'; then
            echo "One or more logo imports failed"
            exit 1
          fi
