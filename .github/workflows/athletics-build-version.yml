name: Athletics build metadata

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'fieldflow-athletics-admin/version.json'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version metadata
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const sha = process.env.BUILD_SHA;
          const file = 'fieldflow-athletics-admin/version.json';
          let current = {};
          try { current = JSON.parse(fs.readFileSync(file, 'utf8')); } catch {}
          const data = {
            version: current.version || '1.0.0',
            build: sha.slice(0, 7),
            commit: sha,
            released_at: new Date().toISOString()
          };
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          NODE

      - name: Commit build metadata
        run: |
          git config user.name "FieldFlow Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add fieldflow-athletics-admin/version.json
          if git diff --cached --quiet; then
            echo "No version change."
            exit 0
          fi
          git commit -m "chore(athletics): update build metadata"
          git push
