<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin ABSCH Football</title>
<meta http-equiv="refresh" content="0; url=/ctd-football-2026/absch-football-2026-admin/">
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#061722;color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
a{color:#12c8ff}
</style>
</head>
<body>
<div>
  <h1>Admin ABSCH Football</h1>
  <p>Abriendo la aplicación Admin independiente…</p>
  <p><a href="/ctd-football-2026/absch-football-2026-admin/">Continuar al Admin</a></p>
</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/ctd-football-2026/absch-football-2026/admin/')).map(r=>r.unregister()));
    }
  }catch(e){}
  location.replace('/ctd-football-2026/absch-football-2026-admin/');
})();
</script>
</body>
</html>
