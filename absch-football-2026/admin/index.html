<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061722"><title>ABSCH Football 2026 · Admin</title>
<style>
:root{--n:#061722;--n2:#0b2940;--b:#0b5fff;--r:#ff4d4d;--g:#18d39e;--o:#ff9f1c;--bg:#eef3f6;--c:#fff;--line:#d9e3e8;--mut:#71808a;--txt:#13212b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,var(--n),var(--n2))}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:22px;box-shadow:0 24px 70px #0006}.login-head{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:center;text-align:center}.login-head img{width:64px;height:64px;object-fit:contain}.login-head b{display:block;color:var(--n);font-size:18px}.login-head small{color:var(--mut)}
label{display:block;font-size:9px;font-weight:900;color:var(--mut);text-transform:uppercase;margin:10px 0 4px}.ctl{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:900;cursor:pointer}.primary{background:var(--n);color:#fff}.red{background:var(--r);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--n)}.login .btn{width:100%;margin-top:14px}.err{margin-top:10px;background:#fff0f0;color:#9f2525;padding:9px;border-radius:9px;font-size:11px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--n),var(--n2));color:white;box-shadow:0 3px 14px #0003}.head{max-width:1500px;margin:auto;padding:9px 14px;display:flex;align-items:center;gap:10px}.head img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}.head h1{font-size:17px;margin:0}.head p{font-size:9px;color:#bfd2dc;margin:3px 0 0}.head .sp{flex:1}.owner{font-size:9px;background:#ffffff16;padding:7px 9px;border-radius:999px}
nav{max-width:1500px;margin:auto;padding:0 14px 9px;display:flex;gap:6px;overflow:auto}nav button{border:0;border-radius:999px;background:#ffffff12;color:#fff;padding:8px 11px;font-size:10px;font-weight:900;white-space:nowrap}nav button.active{background:var(--r)}
main{max-width:1500px;margin:auto;padding:12px}.panel{display:none}.panel.active{display:block}.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.top h2{margin:0;color:var(--n);font-size:19px}.top .sp{flex:1}.chip{font-size:9px;font-weight:900;border-radius:999px;padding:6px 8px;background:#e5f8f0;color:#08704b}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px}.stat b{display:block;font-size:21px;color:var(--n)}.stat small{font-size:8px;color:var(--mut);font-weight:900}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px;margin-bottom:9px}.toolbar select,.toolbar input{height:35px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:#fff;font-size:10px}.toolbar input{flex:1;min-width:180px}
.timeblock{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:11px;box-shadow:0 2px 8px #10202c08}.timeblock-head{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--n);color:#fff}.timeblock-head b{font-size:13px}.timeblock-head small{font-size:9px;color:#c8d6dd}.timeblock-head .count{margin-left:auto;background:#ffffff18;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900}.tablebox{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th{background:#edf2f4;color:var(--n);font-size:8px;text-transform:uppercase;position:sticky;top:0}th,td{padding:7px 6px;border-bottom:1px solid #edf1f3;white-space:nowrap}td.team{min-width:155px;white-space:normal}.tm{display:flex;align-items:center;gap:5px;font-weight:900}.tm img{width:25px;height:25px;object-fit:contain}.state{display:inline-block;border-radius:999px;padding:4px 7px;background:#edf2f4;color:#5d6b74;font-size:8px;font-weight:900}.state.finished{background:#eaf2ff;color:#0b5fff}.state.live{background:#e4f8f0;color:#08704b}.state.delayed{background:#fff0d8;color:#975800}
.teamgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.teamcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;display:grid;grid-template-columns:48px 1fr auto;gap:8px;align-items:center}.teamcard img{width:46px;height:46px;object-fit:contain}.teamcard b{font-size:11px}.teamcard small{display:block;color:var(--mut);font-size:8px;margin-top:2px}
.group{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}.gh{background:var(--n);color:#fff;padding:8px 10px;font-size:10px;font-weight:900}.stand{overflow:auto}.stand table{min-width:720px}.stand th,.stand td{text-align:center}.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}
.log{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:6px}.log b{font-size:10px}.log small{display:block;color:var(--mut);font-size:8px;margin-top:2px}.log div{font-size:8px;margin-top:5px;color:#51616b}
.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:12px;z-index:50}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:14px}.mh{display:flex;align-items:center}.mh h3{margin:0;color:var(--n)}.mh button{margin-left:auto}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.form label{margin:0}.form input,.form select,.form textarea{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:8px}.form textarea{min-height:65px}.s2{grid-column:span 2}.s4{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.toast{position:fixed;right:12px;bottom:12px;background:var(--n);color:white;padding:9px 12px;border-radius:9px;z-index:80;font-size:10px;font-weight:900}
@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.teamgrid{grid-template-columns:repeat(2,1fr)}.timeblock table{min-width:980px}}@media(max-width:650px){.owner{display:none}.head h1{font-size:14px}.stats{grid-template-columns:repeat(2,1fr)}.teamgrid{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.s2,.s4{grid-column:1/-1}}
</style></head><body>

<script>
const URL='https://qhsvvlcgwdmxxappplzh.supabase.co',KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO';
let TOKEN='',USER_EMAIL='',USER_ROLE='',D={settings:null,entries:[],matches:[],logs:[]};let E=new Map();
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tm=v=>String(v||'').slice(0,5),entry=id=>E.get(id),name=(id,s)=>entry(id)?.display_name||s||'TBD',school=(id,s)=>entry(id)?.school_name||s||'TBD',teamLabel=id=>entry(id)?.team_label||'';
function toast(x,b=false){const el=$('toast');el.textContent=x;el.style.background=b?'#a52e2e':'#061722';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2500)}
async function authFetch(path,opt={}){opt.headers={...(opt.headers||{}),apikey:KEY,'Content-Type':'application/json'};return fetch(URL+path,opt)}
async function api(table,query='',opt={}){opt.headers={...(opt.headers||{}),apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Prefer:'return=representation'};const r=await fetch(URL+'/rest/v1/'+table+query,opt);if(!r.ok)throw new Error(await r.text());const txt=await r.text();return txt?JSON.parse(txt):[]}
async function getRole(){
  const r=await fetch(URL+'/rest/v1/rpc/absch_football_my_role',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'}});
  if(!r.ok)return null;
  const v=await r.json();
  return typeof v==='string'?v:null;
}
async function login(){
  const btn=$('loginBtn'),email=$('email').value.trim().toLowerCase(),p=$('password').value;
  $('loginErr').classList.add('hidden');
  if(!email||!p){$('loginErr').textContent='Enter email and password.';$('loginErr').classList.remove('hidden');return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const r=await authFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password:p})});
    const j=await r.json();
    if(!r.ok||!j.access_token)throw new Error(j?.msg||j?.message||'Invalid login credentials');
    TOKEN=j.access_token;USER_EMAIL=(j.user?.email||email).toLowerCase();USER_ROLE=await getRole();
    if(!USER_ROLE)throw new Error('This Supabase user is not enabled for this tournament.');
    sessionStorage.setItem('absch_token',TOKEN);sessionStorage.setItem('absch_email',USER_EMAIL);
    $('login').classList.add('hidden');$('app').classList.remove('hidden');applyRole();await loadAll();
  }catch(err){
    sessionStorage.removeItem('absch_token');
    $('loginErr').textContent='Access denied: '+(err?.message||'Login error');
    $('loginErr').classList.remove('hidden');
  }finally{
    btn.disabled=false;btn.textContent='Secure Login';
  }
}
$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>{sessionStorage.clear();location.reload()};
async function boot(){
  TOKEN=sessionStorage.getItem('absch_token')||'';if(!TOKEN)return;
  try{
    const r=await authFetch('/auth/v1/user',{headers:{Authorization:'Bearer '+TOKEN}});
    const u=await r.json();
    if(!r.ok||!u?.email){sessionStorage.clear();return}
    USER_EMAIL=String(u.email).toLowerCase();USER_ROLE=await getRole();
    if(!USER_ROLE){sessionStorage.clear();return}
    $('login').classList.add('hidden');$('app').classList.remove('hidden');applyRole();await loadAll()
  }catch(e){sessionStorage.clear()}
}
function applyRole(){
  $('roleChip').textContent=(USER_ROLE==='owner'?'SUPREME ADMIN · ':'ADMIN · ')+USER_EMAIL;
  document.querySelectorAll('[data-owner-only]').forEach(el=>el.classList.toggle('hidden',USER_ROLE!=='owner'));
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active');if(b.dataset.tab==='standings')renderStand();if(b.dataset.tab==='logs')renderLogs()});
async function loadAll(){try{const [s,en,m,l]=await Promise.all([api('absch_football_settings','?select=*&singleton=eq.true&limit=1'),api('absch_football_entries','?select=*&order=sort_order.asc'),api('absch_football_matches','?select=*&order=start_time.asc,field_number.asc,match_number.asc'),api('absch_football_change_log','?select=*&order=created_at.desc&limit=100')]);D={settings:s[0]||null,entries:en,matches:m,logs:l};E=new Map(en.map(x=>[x.id,x]));renderStats();renderDash();renderMatches();renderTeams();renderStand();renderLogs();$('status').textContent='PRIVATE · '+String(D.settings?.status||'draft').toUpperCase()}catch(e){toast(e.message,true)}}
function renderStats(){const fin=D.matches.filter(x=>x.status==='finished').length,live=D.matches.filter(x=>x.status==='live').length;$('stats').innerHTML=[['MATCHES',D.matches.length],['TEAMS',D.entries.length],['FINISHED',fin],['LIVE',live],['REMAINING',D.matches.length-fin]].map(x=>'<div class="stat"><b>'+x[1]+'</b><small>'+x[0]+'</small></div>').join('')}
function renderDash(){const now=D.matches.slice(0,20);$('dashTable').innerHTML='<div class="tablebox"><div class="scroll"><table><thead><tr><th>#</th><th>Time</th><th>Field</th><th>Match</th><th>Status</th><th></th></tr></thead><tbody>'+now.map(m=>'<tr><td><b>#'+m.match_number+'</b></td><td>'+tm(m.start_time)+'</td><td>'+m.field_number+' · '+esc(m.venue_name)+'</td><td class="team">'+esc(name(m.home_entry_id,m.home_source))+' vs '+esc(name(m.away_entry_id,m.away_source))+'</td><td><span class="state '+m.status+'">'+esc(m.status)+'</span></td><td><button class="btn primary" onclick="editMatch(\''+m.id+'\')">Edit</button></td></tr>').join('')+'</tbody></table></div></div>'}
function filtMatches(){const q=$('fq').value.toLowerCase();return D.matches.filter(m=>(!$('fc').value||m.category===$('fc').value)&&(!$('fco').value||m.competition===$('fco').value)&&(!$('ff').value||String(m.field_number)===$('ff').value)&&(!q||[m.match_number,name(m.home_entry_id,m.home_source),name(m.away_entry_id,m.away_source),m.referee_name].join(' ').toLowerCase().includes(q)))}
function renderMatches(){
 const rows=filtMatches();
 const blocks=[...new Set(rows.map(m=>tm(m.start_time)))].sort();
 $('matchBlocks').innerHTML=blocks.map(time=>{
   const ms=rows.filter(m=>tm(m.start_time)===time).sort((a,b)=>a.field_number-b.field_number||a.match_number-b.match_number);
   return '<section class="timeblock"><div class="timeblock-head"><b>'+time+'</b><small>TIME BLOCK</small><span class="count">'+ms.length+' MATCHES</span></div><div class="scroll"><table><thead><tr><th>#</th><th>Field</th><th>Competition</th><th>Home</th><th>Score</th><th>Away</th><th>TA/TR</th><th>Referee</th><th>Status</th><th></th></tr></thead><tbody>'+
   ms.map(m=>{const h=entry(m.home_entry_id),a=entry(m.away_entry_id),score=m.home_score==null||m.away_score==null?'–':m.home_score+'–'+m.away_score;
     const homeSchool=school(m.home_entry_id,m.home_source),awaySchool=school(m.away_entry_id,m.away_source);
     const homeTeam=teamLabel(m.home_entry_id),awayTeam=teamLabel(m.away_entry_id);
     return '<tr><td><b>#'+m.match_number+'</b></td><td><b>Field '+m.field_number+'</b><br><small>'+esc(m.venue_name)+'</small></td><td>'+esc(m.category)+' · '+esc(m.competition)+(m.group_name?' · G'+esc(m.group_name):'')+'</td>'+
     '<td class="team"><div class="tm">'+(h?.logo_url?'<img src="'+esc(h.logo_url)+'">':'')+'<span><b>'+esc(homeSchool)+'</b>'+(homeTeam?'<br><small>Team '+esc(homeTeam)+'</small>':'')+'</span></div></td>'+
     '<td style="text-align:center"><b style="font-size:14px">'+score+'</b></td>'+
     '<td class="team"><div class="tm">'+(a?.logo_url?'<img src="'+esc(a.logo_url)+'">':'')+'<span><b>'+esc(awaySchool)+'</b>'+(awayTeam?'<br><small>Team '+esc(awayTeam)+'</small>':'')+'</span></div></td>'+
     '<td>TA '+m.home_yellow+'-'+m.away_yellow+'<br>TR '+m.home_red+'-'+m.away_red+'</td><td>'+esc(m.referee_name||'—')+'</td><td><span class="state '+m.status+'">'+esc(m.status)+'</span></td><td><button class="btn primary" onclick="editMatch(\''+m.id+'\')">Edit</button></td></tr>'
   }).join('')+'</tbody></table></div></section>'
 }).join('') || '<div class="tablebox"><div style="padding:24px;text-align:center;color:var(--mut)">No matches found.</div></div>';
}
['fc','fco','ff'].forEach(id=>$(id).onchange=renderMatches);$('fq').oninput=renderMatches;
function opts(cat,co,current){return '<option value="">Dynamic / TBD</option>'+D.entries.filter(e=>e.category===cat&&e.competition===co).map(e=>'<option value="'+e.id+'" '+(e.id===current?'selected':'')+'>'+esc(e.display_name)+' · G'+esc(e.group_name||'—')+'</option>').join('')}
window.editMatch=id=>{
 const m=D.matches.find(x=>x.id===id),owner=USER_ROLE==='owner';
 const structural=owner?'<label>Time<input id="mt" type="time" value="'+tm(m.start_time)+'"></label><label>Field<select id="mf">'+Array.from({length:10},(_,i)=>'<option '+(m.field_number===i+1?'selected':'')+'>'+(i+1)+'</option>').join('')+'</select></label><label>Venue<input id="mv" value="'+esc(m.venue_name)+'"></label><label>Status<select id="ms">'+['scheduled','live','finished','delayed','suspended','cancelled','walkover'].map(x=>'<option '+(m.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="s2">Home<select id="mh">'+opts(m.category,m.competition,m.home_entry_id)+'</select></label><label class="s2">Away<select id="ma">'+opts(m.category,m.competition,m.away_entry_id)+'</select></label><label class="s2">Home Source<input id="mhs" value="'+esc(m.home_source||'')+'"></label><label class="s2">Away Source<input id="mas" value="'+esc(m.away_source||'')+'"></label>':'<label class="s4">Match<div style="margin-top:4px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#f7f9fa;font-weight:900">'+tm(m.start_time)+' · Field '+m.field_number+' · '+esc(name(m.home_entry_id,m.home_source))+' vs '+esc(name(m.away_entry_id,m.away_source))+'</div></label><label class="s2">Status<select id="ms">'+['scheduled','live','finished','delayed','suspended','cancelled','walkover'].map(x=>'<option '+(m.status===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>';
 $('modal').innerHTML='<div class="modalback"><div class="modal"><div class="mh"><h3>Edit Match #'+m.match_number+'</h3><button class="btn secondary" onclick="closeM()">✕</button></div><div class="form">'+structural+'<label>Home Score<input id="mhsco" type="number" min="0" value="'+(m.home_score??'')+'"></label><label>Away Score<input id="masco" type="number" min="0" value="'+(m.away_score??'')+'"></label><label>Home TA<input id="mhy" type="number" min="0" value="'+m.home_yellow+'"></label><label>Away TA<input id="may" type="number" min="0" value="'+m.away_yellow+'"></label><label>Home TR<input id="mhr" type="number" min="0" value="'+m.home_red+'"></label><label>Away TR<input id="mar" type="number" min="0" value="'+m.away_red+'"></label><label class="s2">Referee<input id="mr" value="'+esc(m.referee_name||'')+'"></label><label class="s4">Notes<textarea id="mn">'+esc(m.notes||'')+'</textarea></label></div><div class="actions"><button class="btn red" onclick="saveMatch(\''+m.id+'\')">Save Match</button></div></div></div>'
}
window.closeM=()=>{$('modal').innerHTML=''};const ni=v=>v===''?null:Math.max(0,parseInt(v)||0);
window.saveMatch=async id=>{
 const old=D.matches.find(x=>x.id===id);if(!old)return;
 const resultPayload={p_match_id:id,p_status:$('ms').value,p_home_score:ni($('mhsco').value),p_away_score:ni($('masco').value),p_home_yellow:ni($('mhy').value)||0,p_away_yellow:ni($('may').value)||0,p_home_red:ni($('mhr').value)||0,p_away_red:ni($('mar').value)||0,p_referee_name:$('mr').value.trim(),p_notes:$('mn').value.trim()};
 try{
   if(USER_ROLE==='owner'){
     const p={start_time:$('mt').value+':00',field_number:Number($('mf').value),venue_name:$('mv').value.trim(),status:$('ms').value,home_entry_id:$('mh').value||null,away_entry_id:$('ma').value||null,home_source:$('mhs').value.trim()||null,away_source:$('mas').value.trim()||null,home_score:resultPayload.p_home_score,away_score:resultPayload.p_away_score,home_yellow:resultPayload.p_home_yellow,away_yellow:resultPayload.p_away_yellow,home_red:resultPayload.p_home_red,away_red:resultPayload.p_away_red,referee_name:resultPayload.p_referee_name||null,notes:resultPayload.p_notes||null,updated_at:new Date().toISOString()};
     await api('absch_football_matches','?id=eq.'+id,{method:'PATCH',body:JSON.stringify(p)});await log('match',id,old,{...old,...p});
   }else{
     const r=await fetch(URL+'/rest/v1/rpc/absch_football_update_match_result',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(resultPayload)});
     if(!r.ok)throw new Error(await r.text());
   }
   toast('Match saved');closeM();await loadAll()
 }catch(e){toast(e.message,true)}
}
function renderTeams(){const q=$('tq').value.toLowerCase(),a=D.entries.filter(e=>(!$('tc').value||e.category===$('tc').value)&&(!$('tco').value||e.competition===$('tco').value)&&(!$('tg').value||e.group_name===$('tg').value)&&(!q||[e.school_name,e.display_name].join(' ').toLowerCase().includes(q)));$('teamGrid').innerHTML=a.map(e=>'<div class="teamcard">'+(e.logo_url?'<img src="'+esc(e.logo_url)+'">':'<div></div>')+'<div><b>'+esc(e.display_name)+'</b><small>'+esc(e.category)+' · '+esc(e.competition)+' · Group '+esc(e.group_name||'—')+'</small><small>'+esc(e.school_name)+'</small></div><button class="btn secondary" onclick="editTeam(\''+e.id+'\')">Edit</button></div>').join('')}
['tc','tco','tg'].forEach(id=>$(id).onchange=renderTeams);$('tq').oninput=renderTeams;
window.editTeam=id=>{const e=D.entries.find(x=>x.id===id);$('modal').innerHTML='<div class="modalback"><div class="modal"><div class="mh"><h3>Edit Team</h3><button class="btn secondary" onclick="closeM()">✕</button></div><div class="form"><label class="s2">School<input id="es" value="'+esc(e.school_name)+'"></label><label>Team Label<input id="el" value="'+esc(e.team_label)+'"></label><label>Group<select id="eg">'+['A','B','C','D','E','F'].map(x=>'<option '+(e.group_name===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label class="s2">Display Name<input id="ed" value="'+esc(e.display_name)+'"></label><label class="s2">Logo URL<input id="eu" value="'+esc(e.logo_url||'')+'"></label></div><div class="actions"><button class="btn red" onclick="saveTeam(\''+e.id+'\')">Save Team</button></div></div></div>'}
window.saveTeam=async id=>{const old=D.entries.find(x=>x.id===id),p={school_name:$('es').value.trim(),team_label:$('el').value.trim(),display_name:$('ed').value.trim(),group_name:$('eg').value,logo_url:$('eu').value.trim()||null,updated_at:new Date().toISOString()};try{await api('absch_football_entries','?id=eq.'+id,{method:'PATCH',body:JSON.stringify(p)});await log('team',id,old,{...old,...p});toast('Team saved');closeM();await loadAll()}catch(e){toast(e.message,true)}}
function calc(cat,co,g){const ts=D.entries.filter(e=>e.category===cat&&e.competition===co&&e.group_name===g),R=new Map(ts.map(t=>[t.id,{...t,pj:0,pg:0,pe:0,pp:0,ga:0,gc:0,df:0,ta:0,tr:0,fp:0,pts:0}])),ms=D.matches.filter(m=>m.category===cat&&m.competition===co&&m.group_name===g&&m.stage==='group'&&m.status==='finished'&&m.home_score!=null&&m.away_score!=null);ms.forEach(m=>{const h=R.get(m.home_entry_id),a=R.get(m.away_entry_id);if(!h||!a)return;h.pj++;a.pj++;h.ga+=m.home_score;a.ga+=m.away_score;h.gc+=m.away_score;a.gc+=m.home_score;h.ta+=m.home_yellow;a.ta+=m.away_yellow;h.tr+=m.home_red;a.tr+=m.away_red;if(m.home_score>m.away_score){h.pg++;a.pp++;h.pts+=3}else if(m.home_score<m.away_score){a.pg++;h.pp++;a.pts+=3}else{h.pe++;a.pe++;h.pts++;a.pts++}});const a=[...R.values()];a.forEach(x=>{x.df=x.ga-x.gc;x.fp=x.ta+x.tr*3});a.sort((x,y)=>(y.pts-x.pts)||(y.df-x.df)||(y.ga-x.ga)||(x.fp-y.fp)||x.display_name.localeCompare(y.display_name));return a}
function renderStand(){const c=$('sc').value,co=$('sco').value,gs=[...new Set(D.entries.filter(e=>e.category===c&&e.competition===co).map(e=>e.group_name).filter(Boolean))].sort();$('standContent').innerHTML=gs.map(g=>'<div class="group"><div class="gh">'+esc(c)+' · '+esc(co)+' · GROUP '+g+'</div><div class="stand"><table><thead><tr><th>#</th><th>Team</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GA</th><th>GC</th><th>DF</th><th>TA</th><th>TR</th><th>FP</th><th>PTS</th></tr></thead><tbody>'+calc(c,co,g).map((x,i)=>'<tr><td><b>'+(i+1)+'</b></td><td><div class="tm">'+(x.logo_url?'<img src="'+esc(x.logo_url)+'">':'')+'<span>'+esc(x.display_name)+'</span></div></td><td>'+x.pj+'</td><td>'+x.pg+'</td><td>'+x.pe+'</td><td>'+x.pp+'</td><td>'+x.ga+'</td><td>'+x.gc+'</td><td>'+x.df+'</td><td>'+x.ta+'</td><td>'+x.tr+'</td><td>'+x.fp+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</tbody></table></div></div>').join('')}
$('sc').onchange=renderStand;$('sco').onchange=renderStand;
async function log(type,id,oldv,newv){try{await api('absch_football_change_log','',{method:'POST',body:JSON.stringify({admin_email:USER_EMAIL,entity_type:type,entity_id:id,action:'update',old_data:oldv,new_data:newv})})}catch(e){}}
async function loadLogs(){try{D.logs=await api('absch_football_change_log','?select=*&order=created_at.desc&limit=100');renderLogs()}catch(e){toast(e.message,true)}}function renderLogs(){$('logList').innerHTML=D.logs.map(l=>'<div class="log"><b>'+esc(String(l.action).toUpperCase())+' · '+esc(l.entity_type)+'</b><small>'+new Date(l.created_at).toLocaleString('es-CL')+' · '+esc(l.admin_email)+'</small><div>'+esc(diff(l.old_data,l.new_data))+'</div></div>').join('')||'<div class="log">No changes yet.</div>'}function diff(a={},b={}){return [...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>JSON.stringify(a[k])!==JSON.stringify(b[k])&&!['updated_at','created_at'].includes(k)).slice(0,8).map(k=>k+': '+String(a[k]??'—')+' → '+String(b[k]??'—')).join(' · ')||'Saved'}
window.addEventListener('error',ev=>{const box=document.getElementById('loginErr');if(box&&document.getElementById('login')&&!document.getElementById('login').classList.contains('hidden')){box.textContent='Page error: '+(ev.message||'Unknown JavaScript error');box.classList.remove('hidden');}});

document.addEventListener('DOMContentLoaded',()=>{const e=document.getElementById('email');if(e&&!sessionStorage.getItem('absch_token')){setTimeout(()=>{e.value='';},50);}});
boot();
