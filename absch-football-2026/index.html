<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2d5c">
<title>ABSCH Football 2026</title>
<style>
:root{--navy:#0b2d5c;--navy2:#123f7a;--red:#c8102e;--bg:#f4f7fb;--card:#fff;--line:#d9e2ef;--text:#1f2937;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);position:relative}button,select,input{font:inherit}
.ff-watermark{position:fixed;inset:0;pointer-events:none;z-index:0;display:grid;place-items:center;overflow:hidden}.ff-watermark img{width:min(70vw,760px);max-height:70vh;object-fit:contain;opacity:.085;filter:saturate(.95)}.app,.bottom{position:relative;z-index:1}
.app{max-width:980px;margin:auto;padding:8px 8px 88px}
.hero{background:#fff;border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:18px;padding:10px;box-shadow:0 5px 16px #0f172a10}
.head{display:grid;grid-template-columns:66px 1fr 74px;align-items:center;gap:8px}.logo{width:64px;height:64px;object-fit:contain}.head>img:last-child{width:70px;height:64px;background:#fff;border-radius:10px;padding:4px}
.title{text-align:center}.title h1{font-size:17px;line-height:1.05;margin:0;color:var(--navy);font-weight:900}.sub{font-size:9px;color:var(--red);font-weight:900;margin-top:5px}.host{font-size:8px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.stat{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px}.stat b{display:block;color:var(--navy);font-size:16px}.stat small{font-size:7px;color:var(--muted);font-weight:900}
.compbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.comp{border:0;border-radius:11px;padding:10px 4px;color:#fff;font-size:9px;font-weight:900}.shield{background:linear-gradient(135deg,#c8102e,#991b1b)}.cup{background:linear-gradient(135deg,#0b2d5c,#123f7a)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.tabs button{border:0;border-radius:11px;padding:10px 3px;background:#e8edf3;color:var(--navy);font-weight:900;font-size:10px}.tabs button.active{background:var(--red);color:#fff}
.panel{display:none}.panel.active{display:block}.section{background:#fff;border:1px solid var(--line);border-radius:15px;margin-top:8px;padding:10px}.section h2{font-size:15px;color:var(--navy);margin:0 0 2px}.hint{font-size:9px;color:var(--muted);margin-bottom:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px}.filters select,.filters input{width:100%;border:1px solid var(--line);border-radius:9px;height:36px;padding:0 8px;background:#fff;font-size:11px}.wide{grid-column:1/-1}
.match{border:1px solid var(--line);border-radius:12px;margin:7px 0;overflow:hidden;background:#fff}.match.shield{border-top:4px solid var(--red)}.match.cup{border-top:4px solid var(--navy)}.mh{display:flex;justify-content:space-between;padding:8px 9px;font-size:10px;font-weight:900;color:#fff}.match.shield .mh{background:linear-gradient(135deg,#c8102e,#991b1b)}.match.cup .mh{background:linear-gradient(135deg,#0b2d5c,#123f7a)}
.teams{padding:7px 9px;background:#fff}.team{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 7px;font-size:11px;font-weight:900;background:#fff;border-radius:8px}.team+.team{border-top:1px solid #edf1f3}.team img{width:28px;height:28px;object-fit:contain}.score{font-size:15px;color:var(--navy)}.meta{border-top:1px solid #edf1f3;padding:6px 8px;font-size:8.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px}.group{border:1px solid var(--line);border-radius:11px;overflow:hidden}.gh{color:#fff;text-align:center;font-size:10px;font-weight:900;padding:6px}.gt{display:flex;align-items:center;gap:7px;padding:7px 8px;border-top:1px solid #edf1f3;font-size:10px;font-weight:900}.gt img{width:23px;height:23px;object-fit:contain}
.stand-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:8px}.stand{width:100%;min-width:700px;border-collapse:collapse;font-size:9px}.stand th{background:#f1f5f9;color:var(--navy);padding:7px 5px}.stand td{padding:7px 5px;border-top:1px solid #edf1f3;text-align:center}.stand th:nth-child(2),.stand td:nth-child(2){text-align:left}.stteam{display:flex;align-items:center;gap:5px;font-weight:900}.stteam img{width:22px;height:22px;object-fit:contain}
.fixture-filter{display:flex;align-items:center;gap:8px;margin:8px 0 10px}.fixture-filter label{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;white-space:nowrap}.fixture-filter select{flex:1;height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 9px;color:var(--text);font-size:11px}
.rule{background:#f7f9fb;border-left:4px solid var(--red);padding:9px;border-radius:8px;margin:7px 0;font-size:10px;line-height:1.5}.loading,.error{padding:50px 14px;text-align:center;font-weight:900;color:var(--navy)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(980px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:6px 7px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -5px 16px #0001;z-index:20}.bottom button{border:0;background:transparent;color:var(--muted);font-size:9px;font-weight:900;padding:7px 2px}.bottom button.active{color:var(--red)}
@media(min-width:721px){.head{grid-template-columns:90px 1fr 90px}.logo{width:84px;height:84px}.title h1{font-size:26px}.fixture-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.groups{grid-template-columns:repeat(3,1fr)}}
.site-footer{margin:14px auto 0;padding:14px 12px 8px;text-align:center;color:#64748b;font-size:10px;font-weight:700;border-top:1px solid #d9e2ef}.site-footer b{color:#0b2d5c}
</style>
</head>

<script>

async function get(path){const r=await fetch(API+path,{headers:H,cache:'no-store'});if(!r.ok)throw new Error(await r.text());return r.json()}
async function load(){try{const [s,en,m]=await Promise.all([get('absch_football_settings?select=*&singleton=eq.true&limit=1'),get('absch_football_entries?select=*&active=eq.true&order=sort_order.asc'),get('absch_football_matches?select=*&order=start_time.asc,field_number.asc,match_number.asc')]);D={settings:s[0]||null,entries:en,matches:m};render()}catch(err){document.getElementById('root').innerHTML='<div class="error">Unable to load tournament data.<br><small>'+esc(err.message)+'</small><br><br><button onclick="location.reload()">Retry</button></div>'}}
function score(m){return ['live','finished'].includes(m.status)&&m.home_score!=null&&m.away_score!=null}

function competitionButtons(){return '<div class="compbar"><button class="comp shield" data-comp="7th|A">Y7 SHIELD</button><button class="comp cup" data-comp="7th|B/C">Y7 CUP</button><button class="comp shield" data-comp="Junior|A">JUNIOR SHIELD</button><button class="comp cup" data-comp="Junior|B/C">JUNIOR CUP</button></div>'}
function fixtureSchoolFilter(){const schools=[...new Set(D.entries.map(x=>x.school_name).filter(Boolean))].sort((a,b)=>a.localeCompare(b));return '<div class="fixture-filter"><label>School</label><select id="fixtureSchool"><option value="">All schools</option>'+schools.map(s=>'<option value="'+esc(s)+'" '+(fixtureSchool===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div>'}
function standings(cat,c,group){const ts=D.entries.filter(x=>x.category===cat&&x.competition===c&&x.group_name===group),rows=new Map(ts.map(x=>[x.id,{...x,pj:0,pg:0,pe:0,pp:0,ga:0,gc:0,df:0,ta:0,tr:0,fp:0,pts:0}]));const ms=D.matches.filter(m=>m.category===cat&&m.competition===c&&m.group_name===group&&m.stage==='group'&&m.status==='finished'&&m.home_score!=null&&m.away_score!=null);ms.forEach(m=>{const h=rows.get(m.home_entry_id),a=rows.get(m.away_entry_id);if(!h||!a)return;h.pj++;a.pj++;h.ga+=m.home_score;a.ga+=m.away_score;h.gc+=m.away_score;a.gc+=m.home_score;h.ta+=m.home_yellow;a.ta+=m.away_yellow;h.tr+=m.home_red;a.tr+=m.away_red;if(m.home_score>m.away_score){h.pg++;a.pp++;h.pts+=3}else if(m.home_score<m.away_score){a.pg++;h.pp++;a.pts+=3}else{h.pe++;a.pe++;h.pts++;a.pts++}});const a=[...rows.values()];a.forEach(r=>{r.df=r.ga-r.gc;r.fp=r.ta+r.tr*3});a.sort((x,y)=>(y.pts-x.pts)||(y.df-x.df)||(y.ga-x.ga)||(x.fp-y.fp)||x.display_name.localeCompare(y.display_name));return a}

function views(){const [cat,c]=comp.split('|');const ms=D.matches.filter(m=>m.category===cat&&m.competition===c);const gs=[...new Set(D.entries.filter(x=>x.category===cat&&x.competition===c).map(x=>x.group_name).filter(Boolean))].sort();let body='';
if(tab==='fixture'){const fms=ms.filter(m=>{if(!fixtureSchool)return true;const h=e(m.home_entry_id),a=e(m.away_entry_id);return h?.school_name===fixtureSchool||a?.school_name===fixtureSchool});body='<div class="section"><h2>Fixture</h2><div class="hint">'+cat+' '+(c==='A'?'Shield':'Cup')+' · live schedule</div>'+fixtureSchoolFilter()+'<div class="fixture-grid">'+fms.map(m=>'<article class="match '+(c==='A'?'shield':'cup')+'"><div class="mh"><span>'+t(m.start_time)+' · FIELD '+m.field_number+'</span><span>'+cat+' '+(c==='A'?'SHIELD':'CUP')+'</span></div><div class="teams">'+teamRow(e(m.home_entry_id),m.home_source,m.home_score,m)+teamRow(e(m.away_entry_id),m.away_source,m.away_score,m)+'</div><div class="meta"><span>'+(m.group_name?'Group '+m.group_name+' · ':'')+m.stage+' · #'+m.match_number+'</span><span>'+esc(m.referee_name||m.venue_name||'')+'</span></div></article>').join('')+'</div></div>';} 
if(tab==='groups')body='<div class="section"><h2>Groups</h2><div class="groups">'+gs.map(g=>'<div class="group"><div class="gh '+(c==='A'?'shield':'cup')+'">GROUP '+g+'</div>'+D.entries.filter(x=>x.category===cat&&x.competition===c&&x.group_name===g).map((x,i)=>'<div class="gt"><b>'+(i+1)+'</b>'+(x.logo_url?'<img src="'+esc(x.logo_url)+'">':'')+'<span>'+esc(x.display_name)+'</span></div>').join('')+'</div>').join('')+'</div></div>';
if(tab==='standings')body='<div class="section"><h2>Standings</h2><div class="rule"><b>Tie-break:</b> PTS → DF → GA → Head-to-Head → lower Fair Play. TA = 1 FP · TR = 3 FP.</div>'+gs.map(g=>{const r=standings(cat,c,g);return '<div class="group"><div class="gh '+(c==='A'?'shield':'cup')+'">GROUP '+g+'</div><div class="stand-wrap"><table class="stand"><thead><tr><th>#</th><th>TEAM</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GA</th><th>GC</th><th>DF</th><th>TA</th><th>TR</th><th>FP</th><th>PTS</th></tr></thead><tbody>'+r.map((x,i)=>'<tr><td><b>'+(i+1)+'</b></td><td><div class="stteam">'+(x.logo_url?'<img src="'+esc(x.logo_url)+'">':'')+'<span>'+esc(x.display_name)+'</span></div></td><td>'+x.pj+'</td><td>'+x.pg+'</td><td>'+x.pe+'</td><td>'+x.pp+'</td><td>'+x.ga+'</td><td>'+x.gc+'</td><td>'+x.df+'</td><td>'+x.ta+'</td><td>'+x.tr+'</td><td>'+x.fp+'</td><td><b>'+x.pts+'</b></td></tr>').join('')+'</tbody></table></div></div>'}).join('')+'</div>';
if(tab==='rules')body='<div class="section"><h2>Rules</h2><div class="rule"><b>Official tie-break order</b><br>1. Goal Difference (DF)<br>2. Goals For (GA)<br>3. Head-to-Head when applicable<br>4. Fair Play: lower disciplinary score. Yellow = 1 point; Red = 3 points.</div><div class="rule"><b>Full tournament regulations</b><br>The complete official bases will be published here.</div></div>';
return body}
function bind(){document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{comp=b.dataset.comp;render()});const fs=document.getElementById('fixtureSchool');if(fs)fs.onchange=()=>{fixtureSchool=fs.value;render()};document.querySelectorAll('.bottom button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)}})}
load();setInterval(load,30000);
</script></body></html>
