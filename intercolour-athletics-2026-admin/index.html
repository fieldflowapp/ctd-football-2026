<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#071d2d"/>
  <title>Intercolour Athletics 2026 · Track Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--navy:#071d2d;--navy2:#061722;--blue:#0b5fff;--cyan:#12c8ff;--green:#18d39e;--orange:#ff9f1c;--red:#ff4d4d;--purple:#8b5cf6;--ink:#eaf3f8;--muted:#91a7b4;--line:#17384b;--card:#0b2638;--card2:#0e3046;--white:#fff}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,var(--navy2),#04121b 55%);color:var(--ink);min-height:100vh}
    button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{max-width:1500px;margin:auto;padding:18px}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:16px}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:13px;background:linear-gradient(145deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:900;color:#00111b;box-shadow:0 8px 28px #0b5fff33}
    h1{font-size:20px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:2px}
    .pill{border:1px solid var(--line);background:#082232;border-radius:999px;padding:7px 10px;color:#b9ccd7;font-size:12px}
    .grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.panel{background:rgba(11,38,56,.95);border:1px solid var(--line);border-radius:18px;box-shadow:0 15px 45px #0004;overflow:hidden}
    .pad{padding:16px}.panel h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;color:#bcd2de}
    label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field{margin-bottom:11px}
    select,input{width:100%;background:#061c2a;border:1px solid #21465a;color:var(--ink);border-radius:11px;padding:10px 11px;outline:none}select:focus,input:focus{border-color:var(--cyan)}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line);background:#082231}.tab{border:1px solid var(--line);background:#0b293b;color:#b9ced8;border-radius:10px;padding:9px 12px;font-weight:700}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#17384b;color:white}.btn.primary{background:var(--blue)}.btn.good{background:var(--green);color:#03271e}.btn.warn{background:var(--orange);color:#2d1b00}.btn.danger{background:var(--red)}.btn.ghost{background:transparent;border:1px solid #285067}.btn:disabled{opacity:.45;cursor:not-allowed}
    .statrow{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:12px}.stat{background:#082434;border:1px solid var(--line);border-radius:13px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
    .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 9px;border-bottom:1px solid #163548;text-align:left;font-size:13px}th{position:sticky;top:0;background:#0a2a3d;color:#9eb6c3;text-transform:uppercase;font-size:10px;letter-spacing:.06em;z-index:1}tr:last-child td{border-bottom:0}
    .color-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}.Blue{background:#3283ff}.Red{background:#ff5252}.White{background:#fff;border:1px solid #aaa}.Green{background:#21d98f}
    .badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;border:1px solid #2a5166}.ok{color:#5ff0b5}.muted{color:var(--muted)}.bad{color:#ff7a7a}.warntext{color:#ffc36b}
    .heat{border:1px solid var(--line);border-radius:15px;margin:12px 0;overflow:hidden}.heathead{display:flex;justify-content:space-between;align-items:center;background:#0a2b3f;padding:10px 12px}.heatbody{padding:8px}
    .lane{font-weight:900;font-size:16px}.timeinput{width:110px;text-align:center}.mini{font-size:11px;padding:6px 8px;border-radius:8px}
    .message{padding:10px 12px;border-radius:11px;margin:8px 0;background:#082434;border:1px solid var(--line);font-size:12px}.message.good{border-color:#1b7257;color:#8df2c9}.message.bad{border-color:#7a2e35;color:#ffaaaa}.message.warn{border-color:#77501c;color:#ffd08a}
    .login{max-width:420px;margin:10vh auto}.login .panel{padding:22px}.login h1{font-size:24px;margin-bottom:5px}.login .btn{width:100%;margin-top:8px}
    .empty{padding:34px;text-align:center;color:var(--muted)}.right{margin-left:auto}.flex{display:flex;gap:8px;align-items:center}.nowrap{white-space:nowrap}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,1fr)}.shell{padding:10px}.topbar{align-items:flex-start}.desktop-only{display:none}}
  </style>
</head>
<body>
<div id="loginView" class="login">
  <div class="panel">
    <div class="brand" style="margin-bottom:18px"><div class="mark">FF</div><div><h1>Intercolour Athletics 2026</h1><div class="sub">Track Operations · Admin</div></div></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@fieldflow.cl"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn primary" id="loginBtn">Sign in</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="appView" class="shell hidden">
  <div class="topbar">
    <div class="brand"><div class="mark">FF</div><div><h1>Intercolour Athletics 2026</h1><div class="sub">Operational Track Console</div></div></div>
    <div class="flex"><span id="userPill" class="pill"></span><button class="btn ghost mini" id="logoutBtn">Logout</button></div>
  </div>

  <div class="grid">
    <aside class="panel pad">
      <h2>Event selector</h2>
      <div class="field"><label>Category</label><select id="category"></select></div>
      <div class="field"><label>Gender</label><select id="gender"><option value="F">Girls</option><option value="M">Boys</option></select></div>
      <div class="field"><label>Colour</label><select id="colour"><option value="All">All colours</option><option value="Blue">Blue</option><option value="Red">Red</option><option value="White">White</option><option value="Green">Green</option></select></div>
      <div class="field"><label>Track event</label><select id="event"></select></div>
      <div id="eventInfo" class="message"></div>

      <h2 style="margin-top:20px">Quick status</h2>
      <div id="sidebarStatus"></div>
    </aside>

    <main class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="registrations">Registrations</button>
        <button class="tab" data-tab="series">Series</button>
        <button class="tab" data-tab="results">Results</button>
        <button class="tab" data-tab="final">Final</button>
      </div>

      <section id="registrationsPane" class="pad"></section>
      <section id="seriesPane" class="pad hidden"></section>
      <section id="resultsPane" class="pad hidden"></section>
      <section id="finalPane" class="pad hidden"></section>
    </main>
  </div>
</div>

<script>
const SUPABASE_URL='https://qhsvvlcgwdmxxappplzh.supabase.co';
const SUPABASE_KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO';
const TOURNAMENT_SLUG='intercolour-athletics-2026';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
const state={tournament:null,events:[],athletes:[],registrations:[],heats:[],entries:[],tab:'registrations',currentEvent:null};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function colorDot(c){return '<span class="color-dot '+esc(c)+'"></span>'+esc(c)}
function genderName(g){return g==='F'?'Girls':'Boys'}
function fmtTime(v){if(v===null||v===undefined||v==='')return '—';return Number(v).toFixed(3)}
function msg(el,text,type=''){el.innerHTML='<div class="message '+type+'">'+esc(text)+'</div>'}
function eventLabel(e){return e.name+(e.has_final?' · Final':' · Timed heats')}
function currentEvent(){return state.events.find(e=>e.id===$('event').value)||null}

async function signIn(){
  $('loginBtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
  $('loginBtn').disabled=false;
  if(error){msg($('loginMsg'),error.message,'bad');return}
  await boot();
}
async function signOut(){await sb.auth.signOut();location.reload()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('loginView').classList.remove('hidden');$('appView').classList.add('hidden');return}
  $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
  $('userPill').textContent=session.user.email||'Admin';

  const {data:t,error:te}=await sb.from('tournaments').select('*').eq('slug',TOURNAMENT_SLUG).single();
  if(te){alert('Unable to load tournament: '+te.message);return}
  state.tournament=t;

  const {data:e,error:ee}=await sb.from('athletics_events').select('*').eq('tournament_id',t.id).eq('discipline','track').order('sort_order');
  if(ee){alert('Access denied or events unavailable: '+ee.message);return}
  state.events=e||[];

  const cats=['Y5','Y6','Y7','Y8','Intermediate','Senior'];
  $('category').innerHTML=cats.map(x=>'<option>'+x+'</option>').join('');
  wire();
  await refreshEventList();
}

function wire(){
  $('loginBtn').onclick=signIn;$('logoutBtn').onclick=signOut;
  $('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
  $('category').onchange=refreshEventList;$('gender').onchange=refreshEventList;$('colour').onchange=renderAll;$('event').onchange=loadEvent;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
function setTab(tab){
  state.tab=tab;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
  ['registrations','series','results','final'].forEach(x=>$(x+'Pane').classList.toggle('hidden',x!==tab));
  renderAll();
}
async function refreshEventList(){
  const cat=$('category').value,g=$('gender').value;
  const list=state.events.filter(e=>e.category===cat&&e.gender===g);
  $('event').innerHTML=list.map(e=>'<option value="'+e.id+'">'+esc(eventLabel(e))+'</option>').join('');
  await loadEvent();
}
async function loadEvent(){
  state.currentEvent=currentEvent();
  if(!state.currentEvent){renderAll();return}
  const e=state.currentEvent;
  $('eventInfo').innerHTML='<b>'+esc(e.name)+'</b><br><span class="muted">'+esc(e.category)+' · '+genderName(e.gender)+' · '+(e.start_mode==='mass_start'?'Mass start':'8 lanes')+' · '+(e.has_final?'Top 8 → Final':'Top 8 overall → Points')+'</span>';
  await reloadData();
}
async function reloadData(){
  const e=state.currentEvent;if(!e)return;
  const [a,r,h]=await Promise.all([
    sb.from('athletics_athletes').select('*').eq('tournament_id',state.tournament.id).eq('level',e.category).eq('gender',e.gender).eq('active',true).order('color').order('last_name'),
    sb.from('athletics_registrations').select('*').eq('event_id',e.id).order('created_at'),
    sb.from('athletics_track_heats').select('*').eq('event_id',e.id).order('stage').order('heat_number')
  ]);
  if(a.error||r.error||h.error){alert((a.error||r.error||h.error).message);return}
  state.athletes=a.data||[];state.registrations=r.data||[];state.heats=h.data||[];
  if(state.heats.length){
    const ids=state.heats.map(x=>x.id);
    const en=await sb.from('athletics_track_entries').select('*').in('heat_id',ids);
    if(en.error){alert(en.error.message);return}
    state.entries=en.data||[];
  }else state.entries=[];
  renderAll();
}
function renderAll(){renderSidebar();renderRegistrations();renderSeries();renderResults();renderFinal()}

function renderSidebar(){
  const e=state.currentEvent;if(!e){$('sidebarStatus').innerHTML='';return}
  const heats=state.heats.filter(h=>h.stage==='heat'), completed=heats.filter(h=>h.status==='completed').length;
  const final=state.heats.find(h=>h.stage==='final');
  $('sidebarStatus').innerHTML=
    '<div class="message"><b>'+state.registrations.length+'</b> registered athletes</div>'+
    '<div class="message"><b>'+heats.length+'</b> heat(s) · '+completed+' completed</div>'+
    '<div class="message"><b>Final:</b> '+(e.has_final?(final?esc(final.status):'not created'):'not required')+'</div>';
}
function regByAthlete(){const s=new Set(state.registrations.filter(r=>r.status==='registered').map(r=>r.athlete_id));return s}
function renderRegistrations(){
  const pane=$('registrationsPane'),e=state.currentEvent;if(!e){pane.innerHTML='<div class="empty">Select an event.</div>';return}
  const reg=regByAthlete(), counts={Blue:0,Red:0,White:0,Green:0};
  state.registrations.filter(r=>r.status==='registered').forEach(r=>{const a=state.athletes.find(x=>x.id===r.athlete_id);if(a)counts[a.color]++});
  const colour=$('colour')?.value||'All';
  const visibleAthletes=colour==='All'?state.athletes:state.athletes.filter(a=>a.color===colour);
  pane.innerHTML='<div class="toolbar"><button class="btn primary" id="saveRegs">Save changes</button><span class="muted">Select athletes for '+esc(e.name)+(colour!=='All'?' · '+esc(colour):'')+'. Database rules enforce colour limits.</span></div>'+
    '<div class="statrow">'+['Blue','Red','White','Green'].map(c=>'<div class="stat"><b>'+counts[c]+'</b><span>'+c+' registered</span></div>').join('')+'</div>'+
    '<div class="tablewrap"><table><thead><tr><th>In</th><th>Athlete</th><th>Colour</th><th>Level</th></tr></thead><tbody>'+
    visibleAthletes.map(a=>'<tr><td><input style="width:auto" type="checkbox" class="regcb" data-id="'+a.id+'" '+(reg.has(a.id)?'checked':'')+'></td><td><b>'+esc(a.last_name)+', '+esc(a.first_name)+'</b><br><span class="muted">'+esc(a.external_code)+'</span></td><td>'+colorDot(a.color)+'</td><td>'+esc(a.level)+' · '+genderName(a.gender)+'</td></tr>').join('')+
    '</tbody></table></div><div id="regMsg"></div>';
  const btn=$('saveRegs');if(btn)btn.onclick=saveRegistrations;
}
async function saveRegistrations(){
  const e=state.currentEvent, selected=[...document.querySelectorAll('.regcb:checked')].map(x=>x.dataset.id);
  const existing=new Map(state.registrations.map(r=>[r.athlete_id,r]));
  const colour=$('colour')?.value||'All';
  const visibleIds=new Set((colour==='All'?state.athletes:state.athletes.filter(a=>a.color===colour)).map(a=>a.id));
  const toAdd=selected.filter(id=>!existing.has(id));
  const toDel=state.registrations.filter(r=>visibleIds.has(r.athlete_id)&&!selected.includes(r.athlete_id)).map(r=>r.id);
  $('saveRegs').disabled=true;
  for(const athlete_id of toAdd){
    const {error}=await sb.from('athletics_registrations').insert({tournament_id:state.tournament.id,event_id:e.id,athlete_id,status:'registered'});
    if(error){msg($('regMsg'),error.message,'bad');$('saveRegs').disabled=false;await reloadData();return}
  }
  if(toDel.length){
    const {error}=await sb.from('athletics_registrations').delete().in('id',toDel);
    if(error){msg($('regMsg'),error.message,'bad');$('saveRegs').disabled=false;await reloadData();return}
  }
  $('saveRegs').disabled=false;await reloadData();msg($('regMsg'),'Registrations saved.','good');
}
function entriesForHeat(id){return state.entries.filter(x=>x.heat_id===id)}
function athleteForEntry(en){
  const r=state.registrations.find(x=>x.id===en.registration_id);return r?state.athletes.find(a=>a.id===r.athlete_id):null
}
function renderSeries(){
  const pane=$('seriesPane'),e=state.currentEvent;if(!e){pane.innerHTML='';return}
  const heats=state.heats.filter(h=>h.stage==='heat');
  let top='<div class="toolbar"><button class="btn primary" id="generateHeats">Generate / Rebuild heats</button>';
  if(e.start_mode==='mass_start')top+='<input id="massCapacity" type="number" min="2" style="width:140px" placeholder="Runners / heat">';
  top+=' <span class="muted">'+(e.start_mode==='mass_start'?'Mass start: choose capacity or leave empty for one large heat.':'Fixed colour lanes: Blue 1/5 · Red 2/6 · White 3/7 · Green 4/8')+'</span></div><div id="seriesMsg"></div>';
  if(!heats.length){pane.innerHTML=top+'<div class="empty">No series generated yet.</div>'}
  else pane.innerHTML=top+heats.map(h=>{
    const ens=entriesForHeat(h.id).sort((a,b)=>(a.lane??999)-(b.lane??999));
    return '<div class="heat"><div class="heathead"><b>Heat '+h.heat_number+'</b><span class="badge '+(h.status==='completed'?'ok':'')+'">'+h.status+'</span></div><div class="heatbody"><div class="tablewrap"><table><thead><tr><th>'+(e.start_mode==='mass_start'?'#':'Lane')+'</th><th>Athlete</th><th>Colour</th><th>Status</th></tr></thead><tbody>'+
      ens.map((en,i)=>{const a=athleteForEntry(en)||{};return '<tr><td class="lane">'+(e.start_mode==='mass_start'?(i+1):(en.lane??'—'))+'</td><td>'+esc(a.last_name||'')+', '+esc(a.first_name||'')+'</td><td>'+colorDot(a.color||'')+'</td><td>'+esc(en.status)+'</td></tr>'}).join('')+
      '</tbody></table></div></div></div>'
  }).join('');
  const btn=$('generateHeats');if(btn)btn.onclick=generateHeats;
}
async function generateHeats(){
  const cap=state.currentEvent.start_mode==='mass_start'&&$('massCapacity')&&$('massCapacity').value?Number($('massCapacity').value):null;
  $('generateHeats').disabled=true;
  const {data,error}=await sb.rpc('athletics_generate_heats',{p_event_id:state.currentEvent.id,p_capacity:cap});
  $('generateHeats').disabled=false;
  if(error){msg($('seriesMsg'),error.message,'bad');return}
  await reloadData();msg($('seriesMsg'),'Series generated successfully.','good');
}
function renderResults(){
  const pane=$('resultsPane'),e=state.currentEvent;if(!e){pane.innerHTML='';return}
  const heats=state.heats.filter(h=>h.stage==='heat');
  if(!heats.length){pane.innerHTML='<div class="empty">Generate series first.</div>';return}
  pane.innerHTML='<div class="message">Enter official Photo Finish times in seconds (example: 12.483). Use DNS / DNF / DQ when needed.</div><div id="resultMsg"></div>'+
  heats.map(h=>{
    const ens=entriesForHeat(h.id).sort((a,b)=>(a.lane??999)-(b.lane??999));
    return '<div class="heat"><div class="heathead"><div><b>Heat '+h.heat_number+'</b> <span class="badge">'+h.status+'</span></div><div class="flex"><button class="btn mini good saveHeat" data-heat="'+h.id+'">Save</button><button class="btn mini '+(h.status==='completed'?'ghost':'warn')+' completeHeat" data-heat="'+h.id+'">'+(h.status==='completed'?'Reopen':'Complete heat')+'</button></div></div><div class="heatbody"><div class="tablewrap"><table><thead><tr><th>'+(e.start_mode==='mass_start'?'#':'Lane')+'</th><th>Athlete</th><th>Colour</th><th>Status</th><th>Official time</th></tr></thead><tbody>'+
      ens.map((en,i)=>{const a=athleteForEntry(en)||{};return '<tr data-entry="'+en.id+'"><td class="lane">'+(e.start_mode==='mass_start'?(i+1):(en.lane??'—'))+'</td><td><b>'+esc(a.last_name||'')+', '+esc(a.first_name||'')+'</b></td><td>'+colorDot(a.color||'')+'</td><td><select class="entryStatus"><option value="scheduled" '+(en.status==='scheduled'?'selected':'')+'>Scheduled</option><option value="finished" '+(en.status==='finished'?'selected':'')+'>Finished</option><option value="dns" '+(en.status==='dns'?'selected':'')+'>DNS</option><option value="dnf" '+(en.status==='dnf'?'selected':'')+'>DNF</option><option value="dq" '+(en.status==='dq'?'selected':'')+'>DQ</option></select></td><td><input class="timeinput entryTime" type="number" step="0.001" min="0" value="'+(en.official_time??'')+'" placeholder="00.000"></td></tr>'}).join('')+
      '</tbody></table></div></div></div>'
  }).join('');
  document.querySelectorAll('.saveHeat').forEach(b=>b.onclick=()=>saveHeat(b.dataset.heat));
  document.querySelectorAll('.completeHeat').forEach(b=>b.onclick=()=>toggleHeat(b.dataset.heat));
}
async function saveHeat(heatId){
  const rows=[...document.querySelectorAll('[data-entry]')].filter(r=>state.entries.find(e=>e.id===r.dataset.entry)?.heat_id===heatId);
  for(const row of rows){
    const id=row.dataset.entry,status=row.querySelector('.entryStatus').value,raw=row.querySelector('.entryTime').value;
    const official_time=raw===''?null:Number(raw);
    const patch={status,official_time};
    if(status==='finished'&&official_time===null){msg($('resultMsg'),'A finished athlete must have an official time.','bad');return}
    const {error}=await sb.from('athletics_track_entries').update(patch).eq('id',id);
    if(error){msg($('resultMsg'),error.message,'bad');return}
  }
  await reloadData();msg($('resultMsg'),'Heat results saved.','good');
}
async function toggleHeat(heatId){
  await saveHeat(heatId);
  const h=state.heats.find(x=>x.id===heatId);const next=h.status==='completed'?'scheduled':'completed';
  const {error}=await sb.from('athletics_track_heats').update({status:next,updated_at:new Date().toISOString()}).eq('id',heatId);
  if(error){msg($('resultMsg'),error.message,'bad');return}
  await reloadData();
  if(next==='completed'&&state.currentEvent.has_final){
    const {data,error:qe}=await sb.rpc('athletics_prepare_sprint_final',{p_event_id:state.currentEvent.id});
    if(!qe&&data&&data[0]&&data[0].status==='FINAL_CREATED'){
      await sb.rpc('athletics_seed_sprint_final_lanes',{p_event_id:state.currentEvent.id});
      await reloadData();
    }
  }
}
async function getLiveRanking(stageMode){
  const {data,error}=await sb.from('athletics_track_live_ranking').select('*').eq('event_id',state.currentEvent.id).order('place');
  if(error)return [];
  return data||[];
}
function renderResultsRanking(ranking){
  if(!ranking.length)return '<div class="empty">No official ranking available yet.</div>';
  return '<div class="tablewrap"><table><thead><tr><th>Place</th><th>Athlete</th><th>Colour</th><th>Time</th><th>Points</th></tr></thead><tbody>'+
  ranking.map(x=>'<tr><td><b>'+x.place+'</b></td><td>'+esc(x.last_name)+', '+esc(x.first_name)+'</td><td>'+colorDot(x.color)+'</td><td><b>'+fmtTime(x.official_time)+'</b></td><td>'+Number(x.points||0).toFixed(3).replace(/\.000$/,'')+'</td></tr>').join('')+
  '</tbody></table></div>';
}
async function renderFinal(){
  const pane=$('finalPane'),e=state.currentEvent;if(!e){pane.innerHTML='';return}
  if(!e.has_final){
    pane.innerHTML='<div class="message">This event has no final. The 8 fastest times across all heats receive points.</div><div id="timedRanking">Loading…</div>';
    const ranking=await getLiveRanking();if($('timedRanking'))$('timedRanking').innerHTML=renderResultsRanking(ranking);
    return;
  }
  const finalHeat=state.heats.find(h=>h.stage==='final');
  let head='<div class="toolbar"><button class="btn primary" id="prepareFinal">Prepare Top 8 Final</button>';
  if(finalHeat)head+='<button class="btn good" id="seedFinal">Seed lanes center-out</button>';
  head+='</div><div id="finalMsg"></div>';
  if(!finalHeat){pane.innerHTML=head+'<div class="empty">Final not created yet. Complete all heats first.</div>';wireFinalButtons();return}
  const ens=entriesForHeat(finalHeat.id).sort((a,b)=>(a.lane??999)-(b.lane??999));
  pane.innerHTML=head+'<div class="heat"><div class="heathead"><b>FINAL · '+esc(e.name)+'</b><span class="badge">'+finalHeat.status+'</span></div><div class="heatbody"><div class="tablewrap"><table><thead><tr><th>Lane</th><th>Athlete</th><th>Colour</th><th>Status</th><th>Official time</th><th>Admin lane</th></tr></thead><tbody>'+
  ens.map(en=>{const a=athleteForEntry(en)||{};return '<tr data-final-entry="'+en.id+'"><td class="lane">'+(en.lane??'—')+'</td><td><b>'+esc(a.last_name||'')+', '+esc(a.first_name||'')+'</b></td><td>'+colorDot(a.color||'')+'</td><td><select class="fStatus"><option value="scheduled" '+(en.status==='scheduled'?'selected':'')+'>Scheduled</option><option value="finished" '+(en.status==='finished'?'selected':'')+'>Finished</option><option value="dns" '+(en.status==='dns'?'selected':'')+'>DNS</option><option value="dnf" '+(en.status==='dnf'?'selected':'')+'>DNF</option><option value="dq" '+(en.status==='dq'?'selected':'')+'>DQ</option></select></td><td><input class="timeinput fTime" type="number" step="0.001" min="0" value="'+(en.official_time??'')+'"></td><td><select class="fLane">'+[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'" '+(en.lane===n?'selected':'')+'>'+n+'</option>').join('')+'</select></td></tr>'}).join('')+
  '</tbody></table></div><div class="toolbar" style="margin-top:10px"><button class="btn good" id="saveFinal">Save final</button><button class="btn warn" id="completeFinal">'+(finalHeat.status==='completed'?'Reopen final':'Complete final')+'</button></div></div></div><h2>Official ranking</h2><div id="finalRanking">Loading…</div>';
  wireFinalButtons();
  const ranking=await getLiveRanking();if($('finalRanking'))$('finalRanking').innerHTML=renderResultsRanking(ranking);
}
function wireFinalButtons(){
  if($('prepareFinal'))$('prepareFinal').onclick=prepareFinal;
  if($('seedFinal'))$('seedFinal').onclick=seedFinal;
  if($('saveFinal'))$('saveFinal').onclick=saveFinal;
  if($('completeFinal'))$('completeFinal').onclick=completeFinal;
}
async function prepareFinal(){
  const {data,error}=await sb.rpc('athletics_prepare_sprint_final',{p_event_id:state.currentEvent.id});
  if(error){msg($('finalMsg'),error.message,'bad');return}
  const row=data&&data[0];if(!row)return;
  if(row.status==='FINAL_CREATED'){
    await sb.rpc('athletics_seed_sprint_final_lanes',{p_event_id:state.currentEvent.id});
    await reloadData();msg($('finalMsg'),row.message,'good');
  }else msg($('finalMsg'),row.message,row.status==='TIE_AT_CUTOFF'?'warn':'bad');
}
async function seedFinal(){
  const {data,error}=await sb.rpc('athletics_seed_sprint_final_lanes',{p_event_id:state.currentEvent.id});
  if(error){msg($('finalMsg'),error.message,'bad');return}
  await reloadData();msg($('finalMsg'),data&&data[0]?data[0].message:'Final lanes seeded.','good');
}
async function saveFinal(){
  const rows=[...document.querySelectorAll('[data-final-entry]')];
  const payload=rows.map(row=>{
    const status=row.querySelector('.fStatus').value;
    const raw=row.querySelector('.fTime').value;
    return {
      id:row.dataset.finalEntry,
      lane:Number(row.querySelector('.fLane').value),
      status,
      official_time:raw===''?'':Number(raw)
    };
  });
  const lanes=payload.map(x=>x.lane);
  if(new Set(lanes).size!==lanes.length){msg($('finalMsg'),'Final lanes cannot be duplicated.','bad');return false}
  if(payload.some(x=>x.status==='finished'&&x.official_time==='')){msg($('finalMsg'),'A finished finalist must have an official time.','bad');return false}
  const {error}=await sb.rpc('athletics_save_final',{p_event_id:state.currentEvent.id,p_entries:payload});
  if(error){msg($('finalMsg'),error.message,'bad');return false}
  await reloadData();msg($('finalMsg'),'Final saved. Manual lane choices preserved.','good');
  return true;
}
async function completeFinal(){
  const saved=await saveFinal();if(!saved)return;
  const finalHeat=state.heats.find(h=>h.stage==='final');if(!finalHeat)return;
  const next=finalHeat.status==='completed'?'scheduled':'completed';
  const {error}=await sb.from('athletics_track_heats').update({status:next,updated_at:new Date().toISOString()}).eq('id',finalHeat.id);
  if(error){msg($('finalMsg'),error.message,'bad');return}
  await reloadData();
}

sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload()});
boot();
</script>
</body>
</html>
