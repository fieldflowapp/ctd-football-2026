<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d2d"><title>Intercolour Athletics 2026 · Relays</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#071d2d;--navy2:#061722;--blue:#0b5fff;--cyan:#12c8ff;--green:#18d39e;--orange:#ff9f1c;--red:#ff4d4d;--ink:#eaf3f8;--muted:#91a7b4;--line:#17384b;--card:#0b2638}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(180deg,var(--navy2),#04121b);color:var(--ink);min-height:100vh}
button,input,select{font:inherit}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:14px}.panel{background:#0b2638f2;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand{display:flex;gap:10px;align-items:center}.mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--blue),var(--cyan));display:grid;place-items:center;font-weight:900;color:#00111b}
h1{font-size:20px;margin:0}.sub,.muted{color:var(--muted);font-size:12px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.nav a{color:#d7e8f0;text-decoration:none;border:1px solid #285067;border-radius:9px;padding:7px 9px;font-size:12px;font-weight:800}.nav a.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.grid{display:grid;grid-template-columns:280px 1fr;gap:12px}.pad{padding:14px}label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.field{margin-bottom:10px}
select,input{width:100%;background:#061c2a;border:1px solid #21465a;color:var(--ink);border-radius:10px;padding:10px;outline:none}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;background:#17384b;color:#fff;cursor:pointer}.primary{background:var(--blue)}.good{background:var(--green);color:#03271e}.warn{background:var(--orange);color:#2d1b00}.ghost{background:transparent;border:1px solid #285067}.btn:disabled{opacity:.45}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar .btn{flex:0 0 auto}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.colorcard{border:1px solid var(--line);border-radius:14px;padding:12px;background:#082434}.colorhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sw{width:13px;height:13px;border-radius:50%;display:inline-block;margin-right:7px}.Blue{background:#3283ff}.Red{background:#ff5252}.White{background:#fff;border:1px solid #aaa}.Green{background:#21d98f}
table{width:100%;border-collapse:collapse;min-width:650px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}th,td{padding:9px;border-bottom:1px solid #163548;text-align:left;font-size:12px}th{background:#0a2a3d;color:#9eb6c3;text-transform:uppercase;font-size:10px}.time{width:110px;text-align:center}.message{padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:12px;margin:8px 0}.goodmsg{color:#8df2c9;border-color:#1b7257}.bad{color:#ffaaaa;border-color:#7a2e35}.double{background:#392904;border:1px solid #7a5a13;color:#ffd98a;padding:10px;border-radius:11px;font-size:12px;margin-bottom:12px}
.login{max-width:420px;margin:9vh auto}.login .panel{padding:20px}.login .btn{width:100%}
@media(max-width:780px){.shell{padding:8px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.toolbar{position:sticky;bottom:6px;z-index:10;background:#082231f5;padding:7px;border:1px solid var(--line);border-radius:12px}.toolbar .btn{flex:1 1 140px}select,input{min-height:46px;font-size:16px}}
</style></head>
<body>
<div id="login" class="login"><div class="panel">
<div class="brand" style="margin-bottom:16px"><div class="mark">FF</div><div><h1>Intercolour Athletics 2026</h1><div class="sub">Relay Admin</div></div></div>
<div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div>
<button class="btn primary" id="loginBtn">Sign in</button><div id="loginMsg"></div></div></div>

<div id="app" class="shell hidden">
<div class="top"><div><div class="brand"><div class="mark">FF</div><div><h1>Relay Finals</h1><div class="sub">Intercolour Athletics 2026</div></div></div>
<div class="nav"><a href="../intercolour-athletics-2026-admin/">Track</a><a href="../intercolour-athletics-2026-field-admin/">Field</a><a class="active" href="./">Relays</a><a href="../intercolour-athletics-2026-scoreboard/">Scoreboard</a></div></div>
<div><span id="user" class="sub"></span> <button class="btn ghost" id="logout">Logout</button></div></div>

<div class="grid">
<aside class="panel pad">
<h1 style="font-size:14px;margin-bottom:12px">Event selector</h1>
<div class="field"><label>Category</label><select id="category"></select></div>
<div class="field"><label>Gender</label><select id="gender"><option value="F">Girls</option><option value="M">Boys</option></select></div>
<div class="field"><label>Relay</label><select id="event"></select></div>
<div id="record" class="message"></div>
<div class="double"><b>DOUBLE POINTS</b><br>Relay points use the event scoring table ×2.</div>
</aside>

<main class="panel pad">
<div class="toolbar"><button class="btn primary" id="saveLineup">Save colours & lanes</button><button class="btn good" id="photoFinish">📷 Photo Finish</button><button class="btn ghost" id="refresh">Refresh</button></div>
<div id="msg"></div>
<h1 style="font-size:15px;margin:10px 0">Final start list</h1>
<div class="cards" id="colorCards"></div>

<h1 style="font-size:15px;margin:18px 0 8px">Final results</h1>
<div class="tablewrap"><table><thead><tr><th>Place</th><th>Lane</th><th>Colour</th><th>Time</th><th>Status</th><th>Points</th></tr></thead><tbody id="results"></tbody></table></div>
<div class="toolbar" style="margin-top:10px"><button class="btn primary" id="saveResults">Save manual results</button></div>
</main>
</div></div>

<script>
const URL='https://qhsvvlcgwdmxxappplzh.supabase.co',KEY='sb_publishable_AzlSdUYiNA5DM7BXGOe5OA_M8wrJGoO',TID='204a8f52-5525-4077-85e4-1d3811d68323';
const sb=window.supabase.createClient(URL,KEY),$=id=>document.getElementById(id),colors=['Blue','Red','White','Green'];
let events=[],current=null,teams=[],relayResults=[],ranking=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const msg=(t,kind='')=>$('msg').innerHTML='<div class="message '+(kind==='good'?'goodmsg':kind==='bad'?'bad':'')+'">'+esc(t)+'</div>';
function fmt(v){if(v==null)return '';const n=Number(v),m=Math.floor(n/60),s=n-m*60;return m?m+':'+s.toFixed(2).padStart(5,'0'):s.toFixed(2)}
function parseTime(v){v=String(v||'').trim();if(!v)return null;if(v.includes(':')){const [m,s]=v.split(':');return Number(m)*60+Number(s)}return Number(v)}
async function boot(){
 const {data:{session}}=await sb.auth.getSession();if(!session)return;
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=session.user.email||'Admin';
 const q=await sb.from('athletics_events').select('*').eq('tournament_id',TID).eq('discipline','relay').order('sort_order');if(q.error){msg(q.error.message,'bad');return}
 events=q.data||[];$('category').innerHTML=['Y5','Y6','Y7','Y8','Intermediate','Senior'].map(x=>'<option>'+x+'</option>').join('');
 refreshEvents();
}
function refreshEvents(){const list=events.filter(e=>e.category===$('category').value&&e.gender===$('gender').value);$('event').innerHTML=list.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join('');loadEvent()}
async function loadEvent(){current=events.find(e=>e.id===$('event').value)||null;if(!current){$('colorCards').innerHTML='';return}
 $('record').innerHTML='<b>'+esc(current.name)+'</b><br><span class="muted">'+esc(current.category)+' · '+(current.gender==='F'?'Girls':'Boys')+' · Final only</span><br><span class="muted">Record: '+esc(current.record_value||'—')+(current.record_year?' ('+current.record_year+')':'')+'</span>';
 const [t,r,k]=await Promise.all([
   sb.from('athletics_relay_teams').select('*').eq('event_id',current.id),
   sb.from('athletics_relay_results').select('*').eq('event_id',current.id).order('lane'),
   sb.from('athletics_relay_ranking').select('*').eq('event_id',current.id).order('place')
 ]);
 if(t.error||r.error||k.error){msg((t.error||r.error||k.error).message,'bad');return}
 teams=t.data||[];relayResults=r.data||[];ranking=k.data||[];render();
}
function render(){
 $('colorCards').innerHTML=colors.map((c,i)=>{
   const team=teams.find(x=>x.color===c),rr=team?relayResults.find(x=>x.relay_team_id===team.id):null;
   return '<div class="colorcard"><div class="colorhead"><b><span class="sw '+c+'"></span>'+c+'</b><label style="display:flex;align-items:center;gap:6px;margin:0"><input class="pick" data-color="'+c+'" type="checkbox" style="width:auto" '+(rr?'checked':'')+'> Run</label></div>'+
   '<label>Lane</label><select class="laneSel" data-color="'+c+'">'+[1,2,3,4,5,6,7,8].map(n=>'<option value="'+n+'" '+((rr?.lane||(i+1))===n?'selected':'')+'>'+n+'</option>').join('')+'</select></div>'
 }).join('');
 const byTeam=new Map(teams.map(t=>[t.id,t]));
 $('results').innerHTML=relayResults.sort((a,b)=>a.lane-b.lane).map(rr=>{
   const t=byTeam.get(rr.relay_team_id),rk=ranking.find(x=>x.result_id===rr.id);
   return '<tr data-id="'+rr.id+'"><td><b>'+(rk?.place||'—')+'</b></td><td>'+rr.lane+'</td><td><span class="sw '+esc(t?.color||'')+'"></span>'+esc(t?.color||'')+'</td>'+
   '<td><input class="time timeInput" value="'+esc(fmt(rr.official_time))+'" placeholder="SS.xx or M:SS.xx"></td>'+
   '<td><select class="statusInput"><option value="scheduled" '+(rr.status==='scheduled'?'selected':'')+'>Scheduled</option><option value="finished" '+(rr.status==='finished'?'selected':'')+'>Finished</option><option value="dns" '+(rr.status==='dns'?'selected':'')+'>DNS</option><option value="dnf" '+(rr.status==='dnf'?'selected':'')+'>DNF</option><option value="dq" '+(rr.status==='dq'?'selected':'')+'>DQ</option></select></td>'+
   '<td><b>'+(rk?Number(rk.points):'—')+'</b></td></tr>'
 }).join('') || '<tr><td colspan="6" class="muted">Save colours and lanes to create the final.</td></tr>';
}
async function saveLineup(){
 const picked=[...document.querySelectorAll('.pick:checked')].map(x=>x.dataset.color);
 const lanes=new Map();for(const c of picked){const lane=Number(document.querySelector('.laneSel[data-color="'+c+'"]').value);if([...lanes.values()].includes(lane)){msg('Each selected colour needs a different lane.','bad');return}lanes.set(c,lane)}
 if(!picked.length){msg('Select at least one colour.','bad');return}
 if(relayResults.some(x=>x.official_time!=null)&&!confirm('This will reset existing relay results for this final. Continue?'))return;
 for(const c of picked){
   let team=teams.find(x=>x.color===c);
   if(!team){
     const q=await sb.from('athletics_relay_teams').insert({tournament_id:TID,event_id:current.id,color:c,status:'registered'}).select().single();if(q.error){msg(q.error.message,'bad');return}team=q.data;
   }else if(team.status!=='registered'){await sb.from('athletics_relay_teams').update({status:'registered'}).eq('id',team.id)}
 }
 const del=await sb.from('athletics_relay_results').delete().eq('event_id',current.id);if(del.error){msg(del.error.message,'bad');return}
 const refreshed=await sb.from('athletics_relay_teams').select('*').eq('event_id',current.id);if(refreshed.error){msg(refreshed.error.message,'bad');return}
 const rows=picked.map(c=>({tournament_id:TID,event_id:current.id,relay_team_id:refreshed.data.find(t=>t.color===c).id,lane:lanes.get(c),status:'scheduled'}));
 const ins=await sb.from('athletics_relay_results').insert(rows);if(ins.error){msg(ins.error.message,'bad');return}
 msg('Relay final saved.','good');await loadEvent();
}
async function saveResults(){
 for(const tr of document.querySelectorAll('#results tr[data-id]')){
   const id=tr.dataset.id,status=tr.querySelector('.statusInput').value,time=parseTime(tr.querySelector('.timeInput').value);
   if(status==='finished'&&(!time||time<=0)){msg('Finished teams need a valid time.','bad');return}
   const q=await sb.from('athletics_relay_results').update({status,official_time:status==='finished'?time:null,updated_at:new Date().toISOString()}).eq('id',id);if(q.error){msg(q.error.message,'bad');return}
 }
 msg('Results saved. Double points recalculated.','good');await loadEvent();
}
$('photoFinish').onclick=()=>{if(!current)return;if(!relayResults.length){msg('Save colours and lanes first.','bad');return}
 const ret='../intercolour-athletics-2026-relay-admin/?event='+encodeURIComponent(current.id);
 location.href='../photo-finish-v2/?relay=1&event='+encodeURIComponent(current.id)+'&return='+encodeURIComponent(ret);
};
async function signIn(){
  const email=$('email').value.trim(),password=$('password').value;
  const btn=$('loginBtn');$('loginMsg').textContent='';
  if(!email||!password){$('loginMsg').textContent='Enter email and password.';return}
  btn.disabled=true;btn.textContent='Signing in…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data?.session)throw new Error('Sign in completed but no session was returned.');
    $('loginMsg').textContent='Signed in.';
    await boot();
  }catch(err){
    console.error('Relay sign in error',err);
    $('loginMsg').textContent=err.message||String(err);
  }finally{
    btn.disabled=false;btn.textContent='Sign in';
  }
}
$('loginBtn').onclick=signIn;
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('category').onchange=refreshEvents;$('gender').onchange=refreshEvents;$('event').onchange=loadEvent;$('saveLineup').onclick=saveLineup;$('saveResults').onclick=saveResults;$('refresh').onclick=loadEvent;

sb.auth.onAuthStateChange((event,session)=>{
  if(event==='SIGNED_IN'&&session){$('login').classList.add('hidden');$('app').classList.remove('hidden')}
  if(event==='SIGNED_OUT'){location.reload()}
});
boot();
</script></body></html>
