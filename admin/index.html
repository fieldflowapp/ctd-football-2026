    <h2>Admin access</h2>
    <p>Sign in with your FieldFlow administrator account.</p>

    <form id="loginForm">
      <input id="email" type="email" autocomplete="username" placeholder="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary" type="submit">Sign in</button>
    </form>

  <section id="adminView" class="hidden">

      <div class="toolbar-title">

      </div>

          <option value="ALL">All matches</option>
          <option value="FINAL">Finished</option>

        <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
        <button id="logoutBtn" class="btn ghost" type="button">Logout</button>
