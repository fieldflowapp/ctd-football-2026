<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B1F3A">
  <title>Admin · CTD Football 2026</title>
  <link rel="stylesheet" href="admin.css?v=20260902-1">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img id="schoolLogo" alt="Craighouse">
    <div>
      <h1>CTD Football 2026</h1>
      <p>FieldFlow Admin</p>
    </div>
  </div>
  <div class="top-actions">
    <span id="connection" class="connection offline">Offline</span>
    <a class="public-link" href="../">Public</a>
  </div>
</header>

<main class="container">
  <section id="loginView" class="login-card">
    <div class="login-mark">FF</div>
    <h2>Admin access</h2>
    <p>Enter the tournament PIN.</p>
    <form id="loginForm">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" maxlength="12" required>
      <button class="btn primary" type="submit">Enter Admin</button>
    </form>
    <div id="loginError" class="form-error"></div>
  </section>

  <section id="adminView" class="hidden">
    <div class="toolbar">
      <div class="toolbar-title">
        <h2>Match Control</h2>
        <p id="updatedText">Loading tournament…</p>
      </div>
      <div class="toolbar-actions">
        <select id="categoryFilter" aria-label="Category">
          <option value="ALL">All categories</option>
          <option value="Intermedia">Intermedia</option>
          <option value="Senior">Senior</option>
        </select>
        <select id="statusFilter" aria-label="Status">
          <option value="ACTIVE">Active + scheduled</option>
          <option value="ALL">All matches</option>
          <option value="FINAL">Finished</option>
        </select>
        <button id="refreshBtn" class="btn secondary" type="button">Refresh</button>
        <button id="logoutBtn" class="btn ghost" type="button">Logout</button>
      </div>
    </div>

    <div id="summary" class="summary"></div>
    <div id="flash" class="flash hidden"></div>
    <div id="matches" class="matches"><div class="loading">Loading…</div></div>
  </section>
</main>

<script src="../js/config.js?v=20260902-1250"></script>
<script src="admin-api.js?v=20260902-1"></script>
<script src="admin.js?v=20260902-1"></script>
</body>
</html>
